<h1>&#128240; 新闻存档</h1>
<div class="sub">加红 0 条（全文）&nbsp;·&nbsp;全部 4 条</div>
</header>
<div class="arcbar">
<button id="f-all" class="on" type="button">全部 4</button>
<button id="f-red" type="button">只看加红 0</button>
<button id="f-open" type="button">展开全文</button>
</div>
<div id="list">
<div class="arc" data-cat="all"><span class="t">00:23</span><span class="h plain">文件显示，德国石油储备机构周五发布招标，拟从储备中出售柴油、取暖油和原油。</span></div><div class="arc" data-cat="all"><span class="t">00:22</span><span class="h plain">俄军宣布27日起在赫尔松方向停火并实行“静默状态”</span></div><div class="arc" data-cat="all"><span class="t">00:08</span><span class="h plain">佩斯科夫：军方正在协调奥列什基停火期限</span></div><div class="arc" data-cat="all"><span class="t">00:03</span><span class="h plain">法国10年期国债风险溢价下降7个基点，为10月6日以来最大降幅。</span></div>
</div>
<script>
(function(){
  var list=document.getElementById('list');
  function setFilter(mode){
    document.getElementById('f-all').className = mode==='all'?'on':'';
    document.getElementById('f-red').className = mode==='red'?'on':'';
    Array.prototype.forEach.call(list.children,function(el){
      el.style.display = (mode==='red' && el.dataset.cat!=='red') ? 'none' : '';
    });
  }
  document.getElementById('f-all').onclick=function(){setFilter('all');};
  document.getElementById('f-red').onclick=function(){setFilter('red');};
  var open=false;
  document.getElementById('f-open').onclick=function(){
    open=!open; this.textContent = open?'收起全文':'展开全文';
    Array.prototype.forEach.call(list.querySelectorAll('details'),function(d){d.open=open;});
  };
})();
</script>
