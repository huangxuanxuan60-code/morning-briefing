<h1>乘联分会：10月新能源汽车销量同比下降13.7% 环比增长2.3%</h1>
<p>财联社11月9日电，乘联分会发布数据，10月新能源汽车销量110.9万辆，同比下降13.7%，环比增长2.3%；10月新能源汽车出口58.2万辆，同比增长144.7%，环比增长3.9%。</p>
