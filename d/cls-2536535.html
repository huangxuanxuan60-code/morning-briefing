<h1>外交部回应美国政府调查涉英伟达芯片一事</h1>
<p>财联社11月17日电，外交部发言人郭嘉昆主持例行记者会。有记者提问：据报道，美国政府正在调查新加坡某公司，指控其涉嫌非法向中方转运英伟达的芯片。请问中方对此有何评论？郭嘉昆表示，我要强调中方在美国输华芯片的问题上的立场是一贯的。 （央视新闻）</p>
