<h1>美国10月非农就业人数增加16.5万人 远超市场预期</h1>
<p>财联社11月6日电，美国10月非农就业人数增加16.5万人，预估为增加6.5万人，前值为增加2.9万人。平均时薪环比上涨0.4%，同比上涨3.1%，市场预期分别为0.3%和2.9%。前值方面，8月非农新增就业人数由13.3万人上修至18.6万人，9月由2.9万人上修至6万人，两个月合计上修8.4万人。</p>
