<h1>重庆市委原副书记、市政府原市长黄奇帆被查</h1>
<p>财联社10月13日电，重庆市委原副书记、市政府原市长黄奇帆涉嫌严重违纪违法，目前正接受中央纪委国家监委纪律审查和监察调查。 （中央纪委国家监委网站）</p>
