<h1>美要求非紧急人员撤离沙特</h1>
<p>财联社10月22日电，美国国务院当地时间10月21日证实，已下令要求驻沙特阿拉伯的非紧急岗位美国政府雇员及其家属撤离。美国国务院发言人皮戈特称，美方这一决定出于“保障国务院人员及其家属的安全”。他说，也门胡塞武装针对沙特的敌对行动日益频繁，包括对民用机场及其他关键基础设施的袭击，造成平民伤亡，并导致交通出行受到严重干扰。 （CCTV国际时讯）</p>
