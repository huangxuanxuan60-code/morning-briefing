<h1>美国国债期货收益率持续走低 五年期国债收益率跌15个基点至4.8%</h1>
<p>财联社10月23日电，美国国债期货收益率持续走低，美国五年期国债收益率跌15个基点，报4.8%；30年期国债收益率下跌10个基点至5.30%。</p>
