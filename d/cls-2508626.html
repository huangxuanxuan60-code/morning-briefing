<h1>证监会：全力维护资本市场安全稳定 高度警惕境外挂钩A股个股的杠杆产品等新风险点</h1>
<p>财联社10月19日电，证监会主席吴清在参加2026金融街论坛年会开幕式时表示，坚持稳字当头，全力维护资本市场安全稳定。密切跟踪境内外市场动态，加强风险研判和政策工具储备，巩固完善稳市机制建设，着力加强新型业务风险防范，高度警惕境外挂钩A股个股的杠杆产品等新风险点，持续筑牢资本市场风险防波堤防浪堤。</p>
