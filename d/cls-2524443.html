<h1>长鑫科技：董事长提议将回购金额增加至不低于25亿元-50亿元</h1>
<p>财联社11月4日电，长鑫科技公告，近日，公司收到董事长朱一明的提议，提议将回购金额由“不低于人民币10亿元（含），不超过人民币20亿元（含）”增加至“不低于人民币25亿元（含），不超过人民币50亿元（含）”。</p>
