<h1>“十五五”全国算力用电量预计年均新增1000亿千瓦时以上</h1>
<p>财联社10月30日电，国家能源局今天举行的新闻发布会上介绍，预计“十五五”时期，全国算力用电量年均新增1000亿千瓦时以上，到2030年将达到8000亿千瓦时，占全社会用电量的6%左右。</p>
