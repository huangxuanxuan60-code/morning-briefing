<h1>纳指低开0.36% 存储板块延续跌势 美光科技、海力士跌超5%</h1>
<p>财联社10月13日电，美股三大指数开盘涨跌不一，纳指跌0.36%，道指涨0.76%，标普500指数跌0.06%。存储板块延续跌势，美光科技、海力士跌超5%，西部数据、希捷科技跌超6%。银行股涨跌不一，摩根大通涨1.7%，高盛涨超3%，富国银行跌近3%。</p>
