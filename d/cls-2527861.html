<h1>利弗莫尔中概股龙头指数开盘涨超2% 半导体板块领涨</h1>
<p>财联社11月6日电，利弗莫尔中概股龙头指数开盘涨超2%，报8678.75点。成分股中，日月光投控涨9.19%，慧荣科技涨7.75%，台积电涨7.6%，联电涨7.47%，禾赛涨7.4%。</p>
