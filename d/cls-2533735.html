<h1>尾盘2只沪深300ETF显著放量</h1>
<p>财联社11月13日电，据财联社盯盘数据显示，尾盘半小时，2只沪深300ETF显著放量，沪深300ETF天弘（515330）现成交超7.3亿元，较昨日全天成交额增超27倍，沪深300ETF广发（510360）现成交超3.3亿元，较昨日全天成交额增超4倍。</p>
