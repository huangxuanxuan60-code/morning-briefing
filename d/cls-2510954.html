<h1>外交部：中方维护关键矿产全球产供链稳定与安全的立场没有变化</h1>
<p>财联社10月21日电，外交部发言人毛宁主持例行记者会。有记者问：日本稀土钇库存仅够支撑数月，已请求美国帮忙劝说中方放宽相关出口管制。中方有何评论？对此，毛宁表示，中方依法依规对日本实施出口管制，目的是制止日本“再军事化”和拥核企图，中方维护关键矿产全球产供链稳定与安全的立场没有变化，各方都有责任为此发挥建设性作用。 （央视新闻）</p>
