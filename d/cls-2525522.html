<h1>中概股集体走强 阿里巴巴、百度、蔚来等涨逾4%</h1>
<p>财联社11月4日电，利弗莫尔中概股龙头指数涨幅扩大至3%，报8883.14点。中概股多数上涨，阿里巴巴涨5.57%，拼多多涨3.81%，百济神州涨7.30%，百度涨4.27%，理想汽车涨4.38%，蔚来涨5.49%，哔哩哔哩涨5.80%，万国数据涨8.55%，再鼎医药涨5.51%。京东涨3.44%，小鹏汽车涨3.46%，新东方涨4.41%。</p>
