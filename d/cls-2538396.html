<h1>美联储会议纪要：一些官员称12月加息超过25个基点或是合理的</h1>
<p>财联社11月19日电，美联储会议纪要显示，绝大多数官员认为通胀前景存在上行风险，一些官员称12月加息超过25个基点或是合理的，几乎所有官员都认为采取进一步行动或是合适的。</p>
