<h1>韩国KOSPI指数开盘下跌5.59%</h1>
<p>财联社10月15日电，韩国KOSPI指数开盘下跌5.59%报5673.01点，SK海力士跌超7%，三星电子跌近7%。日经225指数低开1.28%报66880.37点。</p>
