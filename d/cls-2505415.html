<h1>港股午评：恒生科技指数跌2.94% 光通信、半导体板块跌幅居前</h1>
<p>财联社10月15日电，港股午间收盘，恒生指数跌1.47%，恒生科技指数跌2.94%。大型科网股走弱，阿里巴巴、百度集团跌近5%，美团跌近3%，京东集团跌近2%。光通信、半导体板块跌幅居前，长飞光纤光缆跌逾13%，澜起科技、天数智芯、壁仞科技、海光芯正跌超11%，剑桥科技跌逾10%，华虹宏力跌近9%，中际旭创跌超6%，中芯国际跌逾4%。</p>
