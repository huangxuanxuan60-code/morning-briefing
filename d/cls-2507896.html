<h1>创业板指跌逾1% 下跌个股近3800只</h1>
<p>财联社10月19日电，指数走弱，创业板指下挫跌逾1.00%，沪指跌0.33%，深成指跌0.31%。农业、算力硬件、半导体芯片等方向跌幅居前，沪深京三市下跌个股近3800只。</p>
