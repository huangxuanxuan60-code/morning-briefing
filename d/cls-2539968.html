<h1>日韩股市收盘均跌超5%</h1>
<p>财联社11月20日电，韩国KOSPI指数收跌5.21%报4869.96点，创1月16日以来最低水平。三星电子收跌7.01%，SK海力士跌5.92%。日经225指数收跌5.06%，报56436.65点。</p>
