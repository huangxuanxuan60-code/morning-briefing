<h1>科力远：因涉嫌信息披露违法违规 公司及控股股东科力远集团遭证监会立案</h1>
<p>财联社11月2日电，科力远(600478.SH)公告称，公司及控股股东科力远集团于2026年11月2日收到证监会下发的《立案告知书》，因涉嫌信息披露违法违规，证监会决定对公司及控股股东立案。目前公司生产经营活动正常，上述事项不会产生重大影响。立案调查期间，公司将积极配合调查并履行信息披露义务。</p>
