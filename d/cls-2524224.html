<h1>受美伊谈判乐观情绪影响 纳斯达克100指数期货快速拉升涨1%</h1>
<p>财联社11月3日电，受美伊谈判乐观情绪影响，纳斯达克100指数期货快速拉升，涨幅扩大至1%。标普500指数期货涨0.33%，道琼斯指数期货跌幅收窄至0.20%。</p>
