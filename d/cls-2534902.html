<h1>习近平将同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤</h1>
<p>财联社11月16日电，外交部发言人宣布：11月19日，国家主席习近平将同俄罗斯总统普京、美国总统特朗普在深圳举行中俄美元首会晤。</p>
