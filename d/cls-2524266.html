<h1>英伟达股价上涨3% 总市值重回5万亿美元</h1>
<p>财联社11月3日电，美股盘初，英伟达重新夺回美股总市值第一的头衔。英伟达股价上涨3.11%，报208.340美元/股，总市值报5.02万亿美元。苹果股价下跌3.64%，报326.000美元/股，总市值报4.74万亿美元。</p>
