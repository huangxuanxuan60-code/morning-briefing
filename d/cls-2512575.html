<h1>长电科技：拟调增2026年投资计划至182亿元</h1>
<p>财联社10月22日电，长电科技(600584.SH)公告称，公司第九届董事会第四次会议审议通过2026年第三季度报告及投资计划中期调整议案。公司拟将2026年投资计划由110.1亿元调增至182亿元，其中固定资产类投资由99.8亿元调增至173.1亿元，以把握行业发展机遇、加快先进产能布局。该议案尚需提交股东会审议。</p>
