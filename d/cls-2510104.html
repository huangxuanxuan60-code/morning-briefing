<h1>国务院国资委：组建国家数据集团有限公司</h1>
<p>财联社10月20日电，经国务院批准，组建国家数据集团有限公司，由国务院国有资产监督管理委员会代表国务院履行出资人职责，列入国务院国有资产监督管理委员会履行出资人职责的企业名单。</p>
