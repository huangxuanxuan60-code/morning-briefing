<h1>美的集团：截至10月31日累计回购117.57亿元A股股份</h1>
<p>财联社11月3日电，美的集团(000333.SZ)公告称，截至2026年10月31日，公司通过集中竞价交易方式累计回购A股股份1.45亿股，占总股本的1.89%，最高成交价87.71元/股，最低成交价73.66元/股，支付总金额117.57亿元。此前公司已将回购股份用途变更为“用于依法注销减少注册资本”。</p>
