<h1>协创数据：控股股东拟增持5亿元-10亿元公司股份</h1>
<p>财联社11月2日电，协创数据(300857.SZ)公告称，公司控股股东协创智慧拟自公告披露之日起6个月内，通过集中竞价交易、大宗交易等方式增持公司股份，增持金额不低于5亿元且不超过10亿元。</p>
