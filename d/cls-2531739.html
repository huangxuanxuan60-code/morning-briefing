<h1>m9因品质问题被英伟达取消订货？生益科技：未接到任何终端取消订单的通知</h1>
<p>财联社11月11日电，有投资者问，今天有消息说，公司的m9因为品质问题，被英伟达取消了订货。生益科技在互动平台表示，公司未接到任何终端取消订单的通知，目前生产经营情况正常，订单饱满（对于近期网络流传的相关说法，公司对其来源与用意不予置评）。</p>
