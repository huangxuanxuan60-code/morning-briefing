<h1>SK海力士与部分客户磋商延长长期供应协议 现有协议通常为5年</h1>
<p>财联社10月28日电，SK海力士表示，已与包括全球大型云服务提供商在内的14家主要客户签署长期供应协议，并正与部分客户提前磋商延长协议期限。现有协议期限通常为5年，公司称，相关协议采用能够反映市场行情的定价机制，以兼顾盈利稳定性和市场变化下的灵活性。</p>
