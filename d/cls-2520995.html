<h1>美股存储芯片股盘前集体下挫 闪迪跌近10%</h1>
<p>财联社10月30日电，美股盘前，存储芯片及硬盘股普遍走低。闪迪跌9.70%，西部数据跌8.07%，SK海力士跌7.90%，希捷科技跌7.35%，美光科技跌5.92%。</p>
