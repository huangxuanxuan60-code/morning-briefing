<h1>上交所向日出东方下发监管工作函</h1>
<p>财联社11月12日电，上交所向日出东方下发关于日出东方控股股份有限公司有关股价波动事项的监管工作函。该函涉及对象为上市公司，处理事由为关于日出东方控股股份有限公司股价波动事项的监管工作函。</p>
