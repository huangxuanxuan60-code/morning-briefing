<h1>工业富联：拟推不超20亿元员工持股计划</h1>
<p>财联社10月30日电，工业富联(601138.SH)公告称，公司发布2026年员工持股计划草案，拟筹集资金总额不超过20亿元，参与总人数不超过1.2万人，股票来源为二级市场购买。该计划存续期不超过84个月，分三期解锁，解锁比例分别为50%、30%、20%，并设定了2027-2029年净利润累计不低于2400亿元的业绩考核目标。</p>
