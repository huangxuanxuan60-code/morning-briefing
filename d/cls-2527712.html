<h1>国务院常务会议：完善资本市场稳市机制，增强股市内在稳定性</h1>
<p>财联社11月6日电，国务院总理李强11月6日主持召开国务院常务会议。会议指出，持续化解地方政府债务、中小金融机构等领域风险。完善资本市场稳市机制，增强股市内在稳定性，促进资本市场平稳健康发展。 （央视新闻）</p>
