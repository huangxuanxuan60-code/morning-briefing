<h1>亨通光电：控股股东今日首次增持55万股耗资2013万元</h1>
<p>财联社11月20日电，亨通光电(600487.SH)公告称，控股股东亨通集团于11月20日通过集中竞价方式首次增持公司股份55万股，占总股本0.02%，增持金额2013.21万元。增持后，亨通集团持股比例升至24.10%，与一致行动人合计持股27.96%。根据此前计划，亨通集团拟增持金额不低于4亿元且不超过6亿元。</p>
