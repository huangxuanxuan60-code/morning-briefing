<h1>11月5日涨停分析</h1>
<p>财联社11月5日电，今日全市场共84股涨停，连板股总数21只，48股封板未遂，封板率为64%（不含ST股、退市股）。焦点股方面，“羊”字辈的东方海洋12天7板、阳光照明11天6板，大消费板块皇台酒业9天5板，光伏概念股闽发铝业4连板，短剧概念股浙文影业4连板。</p>
