<h1>国务院常务会议：加快重大项目和“六张网”建设实施进度</h1>
<p>财联社11月6日电，国务院总理李强主持召开国务院常务会议，会议指出，要聚焦重点领域持续发力，加快重大项目和“六张网”建设实施进度，支持企业扩大设备更新、无形资产等投资，加强消费线上线下联动和城乡联动，畅通投资消费良性循环。要用好用足各项政策性资金，及时足额拨付涉及基层和企业各类款项，更好发挥财政金融协同促内需政策效应。 （央视新闻）</p>
