<h1>以美元计9月我国出口总额为4471.8亿美元 同比增长36.3%</h1>
<p>财联社10月14日电，据海关总署披露的数据显示，以美元计，9月我国出口总额为4471.8亿美元，同比增长36.3%；进口总额3136.5亿美元，同比增长31%，贸易顺差为1335.3亿美元。1-9月，我国出口总额为33707亿美元，同比增长21.3%；我国进口总额为24325.8亿美元，同比增长27.5%，贸易顺差为9381.1亿美元。</p>
