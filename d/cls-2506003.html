<h1>鹏鼎控股：董事长提议回购3亿元至5亿元股份</h1>
<p>财联社10月15日电，鹏鼎控股(002938.SZ)公告称，公司董事长沈庆芳提议公司通过集中竞价交易方式回购部分股份，用于股权激励或员工持股计划。回购资金总额不低于3亿元，不高于5亿元，回购价格上限不高于80元/股，回购期限为董事会审议通过方案之日起12个月内。</p>
