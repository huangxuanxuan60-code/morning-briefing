<h1>英特尔盘前重挫近24% PC业务疲软不及预期</h1>
<p>财联社10月30日电，英特尔盘前重挫近24%。公司PC业务营收同比下滑5%不及预期，并且预计全球PC市场的疲软将至少延续至2027年上半年。其芯片代工业务的外部商业化模式也尚未完全成熟。</p>
