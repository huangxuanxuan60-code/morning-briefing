<h1>协创数据：全资子公司协创智算签署不超过374.9亿元算力云服务协议</h1>
<p>财联社10月19日电，协创数据(300857.SZ)公告称，公司全资子公司协创智算与客户签署《算力云服务协议》，预计总金额不超过374.9亿元，服务期限为订单验收通过次日起60个月。合同履行预计将对公司未来年度经营成果产生积极影响，但存在资金筹措、交付验收不通过等风险。</p>
