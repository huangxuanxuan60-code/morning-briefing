<h1>美股半导体板块集体走低 费城半导体指数跌4.3%</h1>
<p>财联社11月13日电，美股半导体板块盘中普遍下跌，费城半导体指数跌4.29%。成分股方面，AMD跌8.35%，闪迪跌7.28%，Coherent跌7.00%，迈威尔科技跌6.25%，Lumentum跌6.05%，应用材料跌5.09%，博通跌5.19%，英伟达跌2.46%，台积电跌1.92%，美光科技跌4.18%。三倍做多半导体ETF-Direxion跌13.63%。</p>
