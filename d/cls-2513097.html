<h1>沪指跌逾2% 科创50跌超3%</h1>
<p>财联社10月23日电，指数继续走弱，沪指下挫跌逾2.00%，深成指跌2.37%，创业板指跌2.80%，科创50指数跌超3%。算力硬件、半导体芯片、贵金属、医药生物等方向跌幅居前，沪深京三市下跌个股近5100只，其中近140股跌超9%。</p>
