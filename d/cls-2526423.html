<h1>4天3板引力传媒：截至10月末AI短剧业务收入占经审计2025年公司营收比例不足0.1%</h1>
<p>财联社11月5日电，引力传媒(603598.SH)发布股票交易风险提示性公告，公司AI短剧业务尚处于前期投入阶段，业务规模较小，其市场认可度及盈利模式均存在不确定性，截至10月末该业务产生的收入占经审计2025年公司营业收入的比例不足0.1%，不会对公司业绩构成重大影响。</p>
