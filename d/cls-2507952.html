<h1>九部门：加速脑机接口、具身智能等前沿科技成果向市场转化</h1>
<p>财联社10月19日电，商务部等9部门发布关于加快推进科技兴商的意见。其中提到，加快新型显示、智能终端等领域关键技术研发，拓展典型应用场景、可行商业模式，强化示范推广。培育建设商业技术应用创新中心。聚焦消费品领域培育一批技术转移转化机构，加速脑机接口、具身智能等前沿科技成果向市场转化。支持智能仓储、数智供应链等领域商贸企业申报专精特新企业。</p>
