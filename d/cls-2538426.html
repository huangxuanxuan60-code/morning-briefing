<h1>穆迪将英伟达信用评级展望由正面调整为稳定</h1>
<p>财联社11月19日电，穆迪将英伟达信用评级展望由正面调整为稳定，并确认其优先无抵押债务评级为AA1。该评级反映英伟达卓越的财务状况以及其在AI数据中心运算与网路技术领域的市场领先地位。穆迪称，未来12至18个月内不太可能上调英伟达评级。</p>
