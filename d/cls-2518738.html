<h1>三星电子：已与10家大客户签署长期供货协议</h1>
<p>财联社10月29日电，三星电子称，已与10家大客户签署长期供货协议（LTA）；正与另外10家客户洽谈多年期供货协议。长期供货协议拓展至移动、汽车及其他客户领域。到2030年，长期供货协议占芯片产能比例将达到60%-70%。正与部分客户洽谈延长合同期限。</p>
