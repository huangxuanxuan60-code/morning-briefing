<h1>韩国KOSPI指数跌幅扩大至6%</h1>
<p>财联社10月15日电，随着投资者对人工智能(AI)交易的疑虑加剧，韩国股市KOSPI指数连续七个交易日下跌。截至目前，韩国KOSPI指数跌超6%，报5645.85点，创7月31日以来的最低水平。SK海力士跌超8%，三星电子跌近7%。</p>
