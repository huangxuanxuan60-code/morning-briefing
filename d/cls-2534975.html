<h1>国家统计局：10月规模以上工业增加值同比实际增长4.8%</h1>
<p>财联社11月16日电，国家统计局数据显示，10月份，规模以上工业增加值同比实际增长4.8%。从环比看，10月份，规模以上工业增加值比上月增长0.21%。1—10月份，规模以上工业增加值同比增长5.3%。</p>
