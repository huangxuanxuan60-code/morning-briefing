<h1>尾盘半小时多只宽基ETF显著放量  沪深300ETF华泰柏瑞（510300）成交超40亿</h1>
<p>财联社11月16日电，据财联社盯盘数据显示，尾盘半小时，部分宽基ETF显著放量，  沪深300ETF华泰柏瑞（510300）成交超40亿，沪深300ETF华夏（510330）成交超24亿，科创50ETF易方达（588080）成交近20亿。</p>
