<h1>费城半导体指数跌幅扩大至10% 英伟达跌近12%</h1>
<p>财联社11月21日电，费城半导体指数跌幅扩大至10%。成分股方面，英伟达股价下跌11.76%，台积电股价下跌9.19%，博通股价下跌12.51%，超威半导体股价下跌13.35%，美光科技股价下跌13.03%，阿斯麦股价下跌6.6%。</p>
