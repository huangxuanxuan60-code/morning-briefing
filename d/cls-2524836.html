<h1>多只半导体ETF封涨停 十余只科创芯片ETF涨超10%</h1>
<p>财联社11月4日电，午后半导体行业ETF集体爆发，半导体ETF博时（159582 ）、半导体设备ETF招商（561980）、半导体设备ETF国泰（159516）等纷纷涨停，科创芯片ETF国泰（589100）、科创芯片ETF富国（588810）、科创芯片ETF博时（588990）等多只ETF涨超10%。</p>
