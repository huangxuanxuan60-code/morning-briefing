<h1>聚灿光电：拟定增募资不超15亿元 用于红黄光外延片及芯片扩产升级项目等</h1>
<p>财联社11月9日电，聚灿光电(300708.SZ)公告称，公司拟向特定对象发行股票，募集资金总额不超过15亿元，扣除发行费用后用于年产300万片高性能红黄光外延片及芯片扩产升级项目及研发中心建设项目。</p>
