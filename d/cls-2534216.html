<h1>美国10月PPI同比增长6.5% 低于市场预期</h1>
<p>财联社11月13日电，美国10月生产者价格指数（PPI）同比增长6.5%，预估为6.6%，前值为6.3%。环比上涨0.3%，预估为0.4%。</p>
