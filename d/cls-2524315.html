<h1>费城半导体指数涨幅扩大至4%</h1>
<p>财联社11月4日电，费城半导体指数涨幅扩大至4%，报10741.37点。AMD、闪迪、Cerebras涨超5%，AMR、博通涨超4%，西部数据、恩智浦、英伟达、希捷科技、应用材料涨超3%。</p>
