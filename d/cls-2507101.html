<h1>豪威集团：拟2.5亿元至5亿元回购A股股份</h1>
<p>财联社10月16日电，豪威集团(603501.SH)公告称，公司拟以自有资金及/或自筹资金通过集中竞价交易方式回购A股股份，回购金额不低于2.5亿元且不高于5亿元，回购价格不超过120元/股。本次回购股份将用于实施员工持股计划或股权激励，回购期限为董事会审议通过之日起不超过3个月。</p>
