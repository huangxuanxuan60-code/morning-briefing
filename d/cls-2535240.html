<h1>创业板指跌逾4% 科创50跌超5%</h1>
<p>财联社11月16日电，指数走弱，创业板指下挫跌逾4%，沪指跌0.99%，深成指跌2.41%。机器人、有色金属、光伏、算力硬件、半导体芯片等方向跌幅居前，沪深京三市下跌个股近4300只。</p>
