<h1>韩国KOSPI指数跌幅扩大至3% SK海力士跌逾7%</h1>
<p>财联社11月5日电，韩国KOSPI指数跌幅扩大至3%，现报5512.09点。SK海力士跌逾7%，三星电子跌超4%。</p>
