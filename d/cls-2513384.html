<h1>两只主动ETF一日售罄 易方达与摩根募集规模双双达到20亿</h1>
<p>财联社10月23日电，主动ETF首日发行，已有产品触及首募上限。截至今天下午2点30分，摩根基金、易方达基金的募集规模已触及20亿元的首批主动ETF首募上限，富国基金的募集规模也达到15亿元。发售首日，首批18主动ETF的合计募集规模应超百亿。 （财联社记者 周晓雅）</p>
