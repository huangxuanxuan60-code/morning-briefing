<h1>纳指期货低开1.38%</h1>
<p>财联社10月30日电，周五亚太早盘，道琼斯指数期货跌0.01%，标普500指数期货跌0.59%，纳斯达克100指数期货跌1.38%。WTI原油期货价格涨0.77%，报102.786美元/桶。</p>
