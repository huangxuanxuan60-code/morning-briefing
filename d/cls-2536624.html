<h1>三星电子与苹果即将签署DRAM半导体长期供货协议</h1>
<p>财联社11月17日电，据半导体行业17日消息，三星电子与苹果正在敲定DRAM半导体长期供货协议，将于明年上半年起生效，有效期4‑5年。协议约定DRAM最低供货量，最终成交价格将根据未来市场行情确定。苹果以往更倾向短期合约，每次续约都会要求下调单位采购价格。据悉，苹果近期还与SK海力士签署了对这家内存供应商更为有利的长期供货协议。</p>
