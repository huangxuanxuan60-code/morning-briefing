<h1>日本央行：从明年1月起 将每年出售ETF的规模由3300亿日元上调至约8600亿日元</h1>
<p>财联社10月30日电，日本央行宣布，从明年1月起将每年出售ETF的规模提高至每年约8600亿日元，之前为每年约3300亿日元，完成出售的时间预计从之前的约112年缩短至约43年。</p>
