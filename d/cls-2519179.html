<h1>谷歌连续两个季度录得负自由现金流 盘前重挫逾10%</h1>
<p>财联社10月29日电，谷歌盘前重挫逾10%。公司第三财季营收和利润均不及预期，且自由现金流状况进一步恶化，连续两个季度录得负自由现金流，显示其AI巨额投资尚未产生足够回报以证明支出合理。</p>
