<h1>随着原油价格进一步高企 美股石油巨头股价集体刷新历史新高</h1>
<p>财联社10月23日电，随着原油价格进一步高企，美股上市的石油巨头股价集体刷新历史新高。截至发稿，埃克森美孚股价上涨1.39%，总市值报7430亿美元。雪佛龙股价上涨1.46%，总市值报4544亿美元。壳牌股价上涨1.63%，总市值报2995亿美元。康菲石油涨2.25%。</p>
