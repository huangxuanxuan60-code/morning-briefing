<h1>不实！AI龙头股未出现网传连锁强平现象</h1>
<p>财联社10月22日电，网传“部分AI龙头股发生大额强制平仓，产生连锁反应”，引发部分投资者关注。记者获悉，今日深市AI龙头股未出现网传的连锁强平现象，仅个别股票小额平仓，金额不足十万元，相关传闻为不实信息。 （证券时报）</p>
