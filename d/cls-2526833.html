<h1>得州候任州长：并不反对数据中心产业本身 可在符合条件的前提下与马斯克及其旗下企业保持良好合作关系</h1>
<p>财联社11月6日电，据报道，得克萨斯州候任州长吉娜・伊诺霍萨称，在出台保护得州民众的相关举措前，我们必须叫停当前的数据中心项目。并不反对数据中心产业本身，但反对现行政策下科技巨头享受大额税收减免、无序消耗水电资源、成本向普通居民转嫁的模式。我们可以在符合条件的前提下，与马斯克及其旗下企业保持良好合作关系。</p>
