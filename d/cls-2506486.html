<h1>印尼股市基准指数下跌11% 为自1998年1月以来的最大跌幅</h1>
<p>财联社10月16日电，印尼股市基准指数跌幅扩大至11%，为自1998年1月以来的最大跌幅。消息面上，MSCI考虑将印尼指数重新分类为独立市场。</p>
