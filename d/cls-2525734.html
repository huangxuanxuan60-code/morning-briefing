<h1>国内商品期货开盘涨跌不一 纯苯、聚丙烯触及跌停</h1>
<p>财联社11月5日电，国内商品期货开盘涨跌不一，能化重挫，贵金属大涨，燃料油跌超12%，沥青跌超10%，液化气、原油跌超8%，纯苯、聚丙烯触及跌停，跌幅6%，苯乙烯、BR橡胶、瓶片跌超5%。钯、铂、沪银涨超6%，沪金涨超3%，沪镍涨超2%。</p>
