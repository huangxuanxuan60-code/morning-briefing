<h1>CoreWeave上调全财年营收展望</h1>
<p>财联社11月11日电，CoreWeave第三财季营收36.6亿美元，预估35.6亿美元。CoreWeave第三财季每股亏损1.27美元，预估每股亏损1.46美元。CoreWeave第三财季净亏损7.09亿美元，预估亏损8.504亿美元。CoreWeave预计全财年营收为130亿至133亿美元，此前预期为120亿至130亿美元。</p>
