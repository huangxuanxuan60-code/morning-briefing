<h1>恒生科技指数上涨5%</h1>
<p>财联社11月5日电，恒生科技指数上涨5%至4133.13点。成分股中，天数智芯涨逾10%，网易、美团、小米集团涨超8%，阿里巴巴涨6%，腾讯控股涨逾5%。</p>
