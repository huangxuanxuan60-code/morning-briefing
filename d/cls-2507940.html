<h1>创业板指、科创50双双跌逾2%</h1>
<p>财联社10月19日电，指数继续走弱，创业板指下挫跌逾2.00%，沪指跌0.35%，深成指跌0.87%。农业、算力硬件、半导体芯片、医药生物、房地产等方向跌幅居前，沪深京三市下跌个股近4100只。</p>
