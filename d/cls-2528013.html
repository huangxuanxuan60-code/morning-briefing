<h1>截至10月末 我国外汇储备规模为34052亿美元</h1>
<p>财联社11月7日电，国家外汇管理局统计数据显示，截至2026年10月末，我国外汇储备规模为34052亿美元，较9月末上升49亿美元，升幅为0.14%。我国10月末黄金储备报7830万盎司，9月末为7747万盎司，为连续第24个月增持黄金。</p>
