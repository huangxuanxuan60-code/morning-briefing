<h1>创业板指涨逾1% 算力硬件方向领涨</h1>
<p>财联社10月27日电，指数走强，创业板指拉升涨逾1%，沪指涨0.10%，深成指涨0.71%。算力硬件、半导体芯片等方向跌幅居前，沪深京三市上涨个股近4000只。</p>
