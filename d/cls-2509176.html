<h1>印尼证券交易所调整低价股跌停机制</h1>
<p>财联社10月20日电，印尼证券交易所宣布，调整股价在每股11至14印尼盾之间股票的自动拒绝下跌（ARB）机制，将跌停限制从7%改为1印尼盾。新规适用于主板、发展板和新经济板上市证券，暂定实施至2026年12月31日，之后将评估是否延长。此次调整是在交易所10月19日实施非对称7%跌停机制后进一步评估作出的。</p>
