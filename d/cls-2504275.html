<h1>阿斯麦预计第四季度营收为142亿至152亿欧元</h1>
<p>财联社10月14日电，阿斯麦第三季度净销售额为116.6亿欧元，预估为117亿欧元；净利润49.60亿欧元，上年同期为21.25亿欧元，预估为41.65亿欧元。阿斯麦预计第四季度营收为142亿至152亿欧元，此前市场预估为141.89亿欧元。</p>
