<h1>OIS合约不再充分反映美联储12月加息25个基点</h1>
<p>财联社11月21日电，随着避险买盘增强，美国国债短端延续涨势，与美联储会议日期挂钩的隔夜指数掉期(OIS)定价显示12月政策会议的加息溢价仅为23个基点。从更远期来看，OIS曲线继续进行鸽派重新定价，目前完全消化第二次25个基点加息的时点是在明年3月会议。</p>
