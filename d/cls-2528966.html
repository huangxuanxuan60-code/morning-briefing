<h1>外交部：中方在美国输华芯片问题上的立场是一贯的</h1>
<p>财联社11月9日电，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，路透社报道，60万块美国英伟达高级芯片正在香港，即将被送往中国大陆，中国大陆正在批准这些芯片进口。请问外交部对此有何评论？郭嘉昆表示，中方在美国输华芯片问题上的立场是一贯的。具体情况建议向中方主管部门询问。 （北京日报）</p>
