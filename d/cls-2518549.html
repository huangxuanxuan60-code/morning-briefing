<h1>迈威尔科技据称正就收购Lumentum进行深入谈判</h1>
<p>财联社10月29日电，据知情人士透露，迈威尔科技正就收购数据中心光学器件制造商Lumentum进行深入谈判，这可能是人工智能领域规模扩张竞赛中的一笔巨型交易。交易最快可能于下周宣布。Lumentum市值约830亿美元，迈威尔科技市值约2210亿美元。Lumentum盘后直线拉升涨超10%，迈威尔科技则跌超10%。</p>
