<h1>朗源股份：董事长自愿放弃薪酬 总经理及财务总监自愿降薪</h1>
<p>财联社11月4日电，朗源股份(300175.SZ)公告称，公司董事长赵征自愿放弃自2026年10月1日起按公司薪酬管理制度应领取的薪酬并退还部分薪酬。自2026年10月1日起，公司董事、总经理曹宇晨自愿降低薪酬的50%，董事、财务总监王涛自愿降低薪酬的30%，至其本人另行书面决定恢复领取薪酬之日止。</p>
