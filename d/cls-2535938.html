<h1>美股纳指低开1.2% 芯片股集体下挫</h1>
<p>财联社11月16日电，美股三大指数集体低开，纳指跌1.24%，道指跌0.16%，标普500指数跌0.81%。芯片股集体下挫，闪迪、应用材料、Cerebras跌超6%，希捷科技、西部数据、ARM、AMD跌超5%，英特尔、台积电、博通跌超4%，英伟达跌超2%。</p>
