<h1>微软第一财季营收922.8亿美元 预估906.3亿美元</h1>
<p>财联社10月29日电，微软第一财季经营利润459.2亿美元，预估439.2亿美元；第一财季资本支出393.7亿美元，预估459.3亿美元；第一财季营收922.8亿美元，预估906.3亿美元；第一财季调整后每股收益4.89美元，预估4.73美元。</p>
