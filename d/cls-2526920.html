<h1>香港恒生指数开盘跌1.58% 恒生科技指数跌3.11%</h1>
<p>财联社11月6日电，香港恒生指数开盘跌1.58%，恒生科技指数跌3.11%，智谱跌超8%，蔚来、MIniMax跌超7%，中芯国际跌超6%，小鹏集团跌超5%，百度集团、哔哩哔哩、蓝思科技跌超4%，阿里巴巴、快手跌超3%，美团、腾讯控股跌超2%。</p>
