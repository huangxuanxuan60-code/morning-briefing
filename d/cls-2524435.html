<h1>特朗普：美国没有立即打击伊朗的计划</h1>
<p>财联社11月4日电，美国总统特朗普3日接受英国《金融时报》采访时表示，美国没有立即打击伊朗的计划，并称其对美伊的僵局“感到满意”。他在采访中说：“我们似乎正在得到我们想要的一切。” （新华社）</p>
