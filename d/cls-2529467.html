<h1>国际原油期货延续下跌 布油日内大跌5%</h1>
<p>财联社11月9日电，国际原油期货延续下跌，布伦特原油期货跌幅扩大至5%，报93.302美元/桶。WTI原油期货价格跌4.56%，报86.686美元/桶。二者均创9月初以来新低。消息上，伊朗总统佩泽希齐扬9日表示，伊朗最高领袖穆杰塔巴已下令结束“非战非和”状态，并称伊朗愿意进行谈判，但不会屈服于胁迫或霸凌。</p>
