<h1>消息称：Anthropic IPO拟发行8.25亿股 指示性价格区间为每股70至78美元</h1>
<p>财联社11月10日电，媒体援引最新招股说明书草案报道，Anthropic计划在IPO中发行8.25亿股，指示性价格区间为每股70至78美元。这意味着，Anthropic的IPO拟筹资高达644亿美元。AMD、博通、谷歌、美光、微软、英伟达及台积电合作伙伴等将作为基石投资者，参与一项独立私募配售，合计认购260亿美元公司普通股。</p>
