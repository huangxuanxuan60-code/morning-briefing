<h1>亨通光电：董事长提议回购1亿至2亿元股份</h1>
<p>财联社11月1日电，亨通光电(600487.SH)公告称，公司董事长崔巍提议公司使用自有或自筹资金，通过上交所交易系统以集中竞价方式回购公司A股股份，回购资金总额不低于1亿元且不超过2亿元，回购股份拟用于员工股权激励/员工持股计划或减少注册资本，回购期限为董事会审议通过方案之日起12个月内。</p>
