<h1>部分拿卡渠道受阻？协创数据回应：相关传闻不属实 当前采购渠道畅通算力业务有序推进</h1>
<p>财联社11月13日电，有投资者问，传闻公司部分拿卡渠道受阻，请问是否属实？协创数据在互动平台表示，相关传闻不属实。公司根据业务开展和订单需求统筹安排采购，当前采购渠道畅通，算力业务有序推进。</p>
