<h1>银行间债市继续升温 10年期国债收益率下破1.6%关口</h1>
<p>财联社11月4日电，银行间债市继续升温，主要利率债收益率普遍下行，10年期国债活跃券“26附息国债16”收益率下破1.6%关口，现下行0.5BP报1.5975%。</p>
