<h1>韩国KOSPI指数收涨超3% SK海力士涨近6%</h1>
<p>财联社10月21日电，日经225指数收涨0.85%，报64621.24点；韩国KOSPI指数收涨3.29%，报5735.67点。其中，三星电子涨5.67%，SK海力士涨5.8%。</p>
