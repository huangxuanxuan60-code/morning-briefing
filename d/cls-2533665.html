<h1>商务部副部长凌激与欧委会贸易和经济安全总司总司长约根森举行会谈</h1>
<p>财联社11月13日电，商务部副部长兼中华人民共和国国际贸易谈判副代表凌激11月12日带领中方团队，与欧委会贸易和经济安全总司总司长约根森带领的欧方团队在欧盟总部开展磋商，就中欧贸易投资磋商机制第二次例会成果落实，以及磋商机制第三次例会筹备工作交换意见。</p>
