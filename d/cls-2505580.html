<h1>日韩股市集体大跌 SK海力士重挫11%</h1>
<p>财联社10月15日电，日经225指数收跌4.90%，报64425.95点；韩国KOSPI指数收跌7.56%，报5554.27点，创4月8日以来收盘新低。SK海力士重挫11%。</p>
