<h1>美股恐慌指数VIX飙升逾47% 突破24关口创4月7日以来新高</h1>
<p>财联社11月5日电，美国股市波动率显著上升，标普500波动率指数（VIX）报24.44点，大涨7.83点，涨幅达47.14%，盘中最高触及24.44点，创4月7日以来新高。与此同时，美股三大指数集体下跌，道指跌1.50%，标普500指数跌2.65%，纳指综合指数跌4.25%。</p>
