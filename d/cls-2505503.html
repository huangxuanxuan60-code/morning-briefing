<h1>长实集团就“李嘉诚去世”传闻发出声明</h1>
<p>10月15日午间，长实集团就市场传闻“李嘉诚去世”的消息发出声明。声明称，就今日有媒体转载内地自媒体讹称香港大公报报道长实集团资深顾问李嘉诚去世，“本集团此严正声明‘绝无其事’”。同时，对有关自媒体捏造假新闻予以强烈谴责。</p>
