<h1>上交所向大业股份下发监管工作函</h1>
<p>财联社10月22日电，上交所向大业股份下发关于山东大业股份有限公司有关股价波动事项的监管工作函。该函涉及对象为上市公司，处理事由为关于山东大业股份有限公司有关股价波动事项的监管工作函。</p>
