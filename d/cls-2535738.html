<h1>骏成科技：拟7.65亿元采购9000张GPU卡</h1>
<p>财联社11月16日电，骏成科技(301106.SZ)公告称，公司为夯实研发中心、数据中心基础设施，与供应商Z签订GPU卡采购合同，合同总金额暂定7.65亿元，采购9000张GPU卡。</p>
