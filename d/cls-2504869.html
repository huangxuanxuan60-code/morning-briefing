<h1>美国9月CPI同比增长3.7% 高于市场预期</h1>
<p>财联社10月14日电，美国9月消费者价格指数（CPI）同比增长3.7%，预估为3.6%，前值为3.4%。9月CPI环比增长0.6%，预估0.6%。</p>
