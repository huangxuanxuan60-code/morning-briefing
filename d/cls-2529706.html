<h1>Anthropic拟通过IPO募资至多693亿美元</h1>
<p>财联社11月10日电，据报道，Anthropic拟通过IPO募资至多693亿美元，发行价区间为每股70-80美元。Anthropic拟在IPO中发行866,666,664股A类股。Anthropic表示，基石投资者将在IPO中出售23,333,331股股票。谷歌、英伟达、AMD、博通、美光、微软和台积电将以IPO价格通过私募方式投资260亿美元。</p>
