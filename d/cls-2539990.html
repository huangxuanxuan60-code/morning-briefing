<h1>上证50ETF（510050）尾盘爆量拉升 成交突破215亿创历史天量</h1>
<p>财联社11月20日电，据财联社盯盘数据显示，尾盘上证50ETF华夏（510050）爆量拉升一度涨1%，早盘一度跌超2%，现成交额突破215亿，较昨日全天增超7倍，刷新此前在2026年1月28日创下的214.5亿元的历史天量。</p>
