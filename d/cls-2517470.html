<h1>SK海力士CEO：未来三年DRAM以及HBM产能近乎售罄 中长期销售能见度大幅提升</h1>
<p>财联社10月28日电，SK海力士CEO郭鲁正周三在财报会上透露：“已经敲定的LTA订单，叠加当前和客户正在磋商的需求，未来三年直至2029年，我们的DRAM以及HBM产能实际上已经近乎售罄。磋商当中的订单，均基于客户明确的采购规划，落地概率很高。综合来看，中长期销售的能见度已经大幅提升。”</p>
