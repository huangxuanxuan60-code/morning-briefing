<h1>央行：10月15日将开展7000亿元买断式逆回购操作 期限为6个月</h1>
<p>财联社10月14日电，央行发布公开市场买断式逆回购招标公告称，为保持银行体系流动性充裕，2026年10月15日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展7000亿元买断式逆回购操作，期限为6个月（182天），到期日为2027年4月15日（遇节假日顺延）。</p>
