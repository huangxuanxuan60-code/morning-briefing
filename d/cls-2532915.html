<h1>华虹宏力：拟3亿元-5亿元回购股份用于注销</h1>
<p>财联社11月12日电，华虹宏力(688347.SH)公告，拟3亿元-5亿元回购股份用于注销，回购价格不超过人民币255.55元/股（含），回购股份期限自股东会审议通过本次回购股份方案之日起12个月内。</p>
