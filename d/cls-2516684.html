<h1>姆巴佩遭数家中国公司解约品牌代言 外交部回应</h1>
<p>财联社10月27日电，外交部发言人郭嘉昆主持例行记者会。部分内容实录如下：法新社记者：今天，法国球员姆巴佩因一段网上流传的视频遭到数家中国公司解约品牌代言，视频显示他发表了涉中国的不当言论。外交部对此有何评论？郭嘉昆：我们注意到有关报道。伤害中国人民感情的言行自然会遭到中国社会各界的共同抵制。</p>
