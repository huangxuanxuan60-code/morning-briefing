<h1>冰雪经济概念再度拉升 晶雪节能等多股涨停</h1>
<p>财联社11月9日电，午后冰雪经济概念再度拉升，晶雪节能、雪人集团涨停，此前冰山冷热、龙江交通、龙建股份涨停，探路者、大连圣亚、长白山、欧亚集团等纷纷跟涨。</p>
