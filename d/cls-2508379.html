<h1>普京提议举行中美俄峰会讨论结束乌克兰危机？外交部：目前没有可提供的信息</h1>
<p>财联社10月19日电，外交部发言人毛宁主持例行记者会。彭博社记者提问，据报道，俄罗斯总统普京提议下个月与中美元首举行峰会，讨论结束乌克兰危机的问题。请问中方是否赞同举行这样的会晤？发言人能否提供更多信息？“我目前没有可以提供的信息。”毛宁说。 （北京日报）</p>
