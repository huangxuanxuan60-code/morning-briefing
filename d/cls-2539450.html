<h1>纳指转跌 迅速回吐此前2%的涨幅 市场静待Anthropic上市</h1>
<p>财联社11月19日电，纳斯达克指数由涨转跌，迅速回吐此前约2%的涨幅。道琼斯指数向下跌破50000点，最新报49706.13点，日内下跌1%。市场正密切关注人工智能公司Anthropic即将开启的上市交易。</p>
