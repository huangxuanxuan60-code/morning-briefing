<h1>银行板块逆势回落 中国银行跌超4%</h1>
<p>财联社10月23日电，午后银行板块逆势回落，中国银行跌超4%，农业银行、建设银行、工商银行跌超2%，邮储银行、交通银行、江苏银行等纷纷跟跌。</p>
