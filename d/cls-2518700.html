<h1>三星电子预计2026年股东总回报将达到90-110万亿韩元 将包括一项大规模股票回购和注销计划</h1>
<p>财联社10月29日电，三星电子预计2026年股东总回报将达到90-110万亿韩元（约675–825亿美元），其中35万亿韩元（约263亿美元）已规划或完成。剩余回报资金将包括一项大规模的股票回购和注销计划，以及现金分红。</p>
