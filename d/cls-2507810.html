<h1>韩国KOSPI指数低开3.17% SK海力士跌逾4%</h1>
<p>财联社10月19日电，韩国KOSPI指数开盘下跌3.17%，报5488.41点。SK海力士跌逾4%，三星电子跌超3%。日经225指数低开0.77%，报64819.56点。</p>
