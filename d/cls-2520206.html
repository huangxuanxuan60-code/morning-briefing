<h1>日本央行称基础通胀达到2%的目标水平</h1>
<p>财联社10月30日电，日本央行表示，基础通胀达到2%的目标，暗示为12月加息打开了大门。对日本央行而言，如果连续两次会议加息，将是本世纪以来前所未有之举，并可能令市场受到惊吓。日本的基准利率已经达到31年来最高水平，不过与七国集团其他国家相比仍然较低。</p>
