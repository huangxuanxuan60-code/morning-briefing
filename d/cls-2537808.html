<h1>外交部：中俄美三国元首将就事关全球和平的重要问题深入交换意见</h1>
<p>财联社11月18日电，外交部发言人郭嘉昆11月18日主持例行记者会。有记者就中俄美元首会晤提问。郭嘉昆表示，中方此前已经介绍了中俄美元首深圳会晤的有关安排，三国元首将就事关全球和平的重要问题深入交换意见，我们会及时发布会晤的相关消息，请大家保持关注。 （央视新闻）</p>
