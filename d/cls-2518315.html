<h1>以色列议会选举完成票箱清点 内塔尼亚胡阵营暂时领先</h1>
<p>财联社10月28日电，据以色列方面消息，当地时间28日，截至目前，此轮以色列议会选举已完成全部票箱清点，现任总理内塔尼亚胡领导的利库德集团在已清点的有效选票中得票率仍暂居首位。内塔尼亚胡领导的利库德集团仍为议会第一大党。不过，内塔尼亚胡领导的右翼阵营与埃森科特领导的反对党阵营在议会全体席位分配上呈现胶着态势，目前没有任何单一阵营能够直接达到组阁所需的半数以上席位。</p>
