<h1>白宫经济顾问哈塞特：数据中心仍有很大发展空间 即使建设放缓美国经济仍可保持强劲增长</h1>
<p>财联社11月6日电，白宫国家经济委员会主任凯文·哈塞特表示，数据中心建设仍有很大发展空间，相关项目应由当地社区决定。他同时表示，即使数据中心建设速度放缓，美国经济仍有望实现强劲增长。哈塞特回应了有关AI“泡沫”担忧的问题称，AI“泡沫”确实值得关注。</p>
