<h1>美联储理事沃勒：若不释放1月加息的信号 应在12月加息50个基点</h1>
<p>财联社11月18日电，美联储理事沃勒表示，若不释放1月加息的信号，应在12月加息50个基点；美联储将需要动用其他手段来释放对通胀采取更激进应对措施的信号；为降低通胀，美联储可能不得不采取比逆转去年降息更多的措施。</p>
