<h1>山东黄金：拟3亿元至4亿元回购股份用于注销并减少注册资本</h1>
<p>财联社10月16日电，山东黄金(600547.SH)公告称，公司拟以自有资金及自筹资金通过集中竞价方式回购股份，回购金额不低于3亿元且不超过4亿元，回购价格不超过48.57元/股。本次回购股份将全部用于注销并减少注册资本，回购期限为股东会审议通过之日起12个月内。</p>
