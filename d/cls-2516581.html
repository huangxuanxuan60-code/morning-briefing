<h1>泡泡玛特：2026年第三季度整体收益同比下降45%-50%</h1>
<p>财联社10月27日电，泡泡玛特公告，2026年第三季度整体收益（未经审核）较2025年第三季度同比下降45%-50%；其中中国收益同比下降25%-30%，亚太收益同比下降65%-70%，美洲收益同比下降70%-75%，欧洲及其他地区收益同比下降50%-55%。中国线下渠道收益同比下降5%-10%，线上渠道收益同比下降45%-50%。</p>
