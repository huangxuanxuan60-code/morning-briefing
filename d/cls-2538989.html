<h1>香港恒生科技指数收跌2.33% 腾讯控股跌超6%</h1>
<p>财联社11月19日电，香港恒生指数收跌1.95%，创近五个月收盘新低；恒生科技指数跌2.33%，创26个月收盘新低 。大型科网股下挫，腾讯控股跌超6%，阿里巴巴跌超5%，百度集团跌近5%，美团跌超3%。黄金板块下挫，灵宝黄金跌7%，紫金黄金国际跌超5%，老铺黄金跌超4%。国产晶圆代工双雄上涨，华虹宏力涨超8%，中芯国际涨超2%。</p>
