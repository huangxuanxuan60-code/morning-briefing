<h1>国家统计局：10月份工业生产者出厂价格同比上涨5.7% 环比上涨0.7%</h1>
<p>财联社11月9日电，国家统计局数据显示，2026年10月份，全国工业生产者出厂价格同比上涨5.7%，环比上涨0.7%。工业生产者购进价格同比上涨7.9%，环比上涨1.1%。1—10月平均，工业生产者出厂价格比上年同期上涨2.7%，工业生产者购进价格上涨4.0%。</p>
