<h1>美股恐慌指数VIX升至30，刷新3月底以来盘中最高水平</h1>
<p>美股恐慌指数VIX升至30，刷新3月底以来盘中最高水平。截至发稿，道琼斯指数期货跌0.24%，标普500指数期货跌0.78%，纳斯达克100指数期货跌1.66%。</p>
