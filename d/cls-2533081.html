<h1>特朗普称美国不需要与伊朗达成协议</h1>
<p>财联社11月12日电，美国总统特朗普当地时间11月12日表示，美国不需要与伊朗达成协议。特朗普称，那样的日子早已过去。他声称，美国已经掌握了伊朗数千亿美元的资金以及霍尔木兹海峡。</p>
