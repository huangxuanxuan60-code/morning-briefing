<h1>胜宏科技：实控人提议公司回购1.5亿至3亿元A股股份</h1>
<p>财联社10月16日电，胜宏科技(300476.SZ)公告称，公司实控人兼董事长陈涛提议公司以集中竞价方式回购部分A股股票，回购资金总额不低于1.5亿元且不超过3亿元，回购股份将用于员工持股计划或股权激励。</p>
