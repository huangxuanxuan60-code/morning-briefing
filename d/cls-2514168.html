<h1>伊朗总统将于下周访俄并与普京会谈</h1>
<p>财联社10月24日电，据伊朗方面23日消息，伊朗总统佩泽希齐扬将于下周访问俄罗斯，出席10月27日在莫斯科举行的天然气出口国论坛第八次峰会。另据卡塔尔方面消息，峰会期间，佩泽希齐扬将与俄罗斯总统普京举行会谈。 （央视新闻）</p>
