<h1>英雄联盟全球总决赛中国战队夺冠</h1>
<p>财联社11月15日电，在刚刚结束的英雄联盟全球总决赛决赛中，中国BLG战队战胜韩国Gen战队，加冕S16总冠军，这是中国战队时隔五年再度捧起S赛冠军奖杯。</p>
