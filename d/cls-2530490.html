<h1>显卡价格继续走低 华强北RTX 5080价格从1.8万元降至1.4万元</h1>
<p>财联社11月10日电，深圳华强北电脑零配件批发商金硕利电脑负责人熊容容表示，“本轮高端显卡的价格变化较大，以RTX 5080为例，10月23日的价格大约为1.8万元，今天的价格是1.4万元左右，差距有些大。出货量最大的主流型号RTX 5060相对于上个月微调200元左右，整体而言，显卡都是微调。” （21财经）</p>
