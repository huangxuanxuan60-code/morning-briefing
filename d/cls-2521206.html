<h1>闪迪开盘跌超8.8% 单季营收同比增长378%仍遭抛售</h1>
<p>财联社10月30日电，闪迪美股开盘后跌超8.8%。公司第一财季营收110.31亿美元，同比增长378%；非GAAP每股收益49.51美元，毛利率达到85%。公司预计第二财季营收122亿至126亿美元，但强劲业绩仍未能阻止股价下跌，市场对高估值及存储芯片价格持续性的担忧升温。</p>
