<h1>平安电工：拟定增募资不超13亿元用于高性能电子布等项目</h1>
<p>财联社10月14日电，平安电工(001359.SZ)公告称，公司拟向特定对象发行A股股票，募集资金总额不超过13亿元，扣除发行费用后拟用于泰国云母绝缘材料生产基地建设项目、泰国电子布生产基地建设项目、高性能电子布生产基地建设项目及补充流动资金。</p>
