<h1>外交部回应“英伟达要求其合作伙伴必须将至少51％的服务提供给非中国企业”有关报道</h1>
<p>财联社11月3日电，外交部发言人毛宁主持例行记者会。有记者提问：据《金融时报》报道，英伟达要求一些数据中心合作伙伴必须将至少51％的服务提供给非中国企业。此举或限制中国企业获取人工智能关键技术。中方对此有何回应？对此，毛宁表示，具体情况我不了解。我们一贯认为各方应当按照公平、透明、非歧视的原则开展合作。 （央视新闻）</p>
