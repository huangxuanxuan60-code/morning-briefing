<h1>屹唐股份：拟投资18亿元建设半导体装备制造基地项目</h1>
<p>财联社10月29日电，屹唐股份(688729.SH)公告称，公司拟通过全资子公司屹唐北京在北京经济技术开发区投资建设屹唐半导体集成电路装备制造基地项目，聚焦干法去胶、快速热处理、干法刻蚀及等离子体表面处理等设备规模化生产，投资总额约18亿元。项目用地需通过招拍挂程序取得，尚需办理备案、环评等审批手续，存在不确定性。</p>
