<h1>卢拉成功连任 当选巴西新一任总统</h1>
<p>财联社10月26日电，在当地时间25日举行的巴西总统选举第二轮投票中，劳工党候选人、现任总统卢拉战胜自由党候选人、前总统雅伊尔·博索纳罗之子弗拉维奥·博索纳罗，当选新一任巴西总统。 （央视新闻）</p>
