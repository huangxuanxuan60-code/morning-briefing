<h1>高股息红利股持续走弱 中国石油等多股跌超5%</h1>
<p>财联社11月5日电，高股息红利股盘中持续走弱，煤炭、石油方向领跌，中国石油跌超8%，中国海油、鄂尔多斯、广汇能源、中国神华、兖矿能源均跌超5%。</p>
