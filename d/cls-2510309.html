<h1>国际油价盘中上演大逆转 一度涨超2%后急跌逾3%</h1>
<p>财联社10月20日电，国际油价盘中急转直下，WTI原油一度触及101.37美元/桶，随后快速跳水，现跌3.20%，报95.35美元/桶；布伦特原油一度升至111.95美元/桶，随后跌至105.95美元/桶，跌幅扩大至2.97%。两大原油期货日内均由高位大幅回落，盘中涨势尽数逆转。</p>
