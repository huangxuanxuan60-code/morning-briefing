<h1>费城半导体指数开盘大跌3.6% SK海力士跌6%</h1>
<p>财联社11月12日电，费城半导体指数开盘大跌3.6%，英伟达跌超13%，Coreweave跌超17.3%，戴尔跌超8.7%，闪迪跌9%，SK海力士跌6%，美光科技跌5.6%，台积电、英特尔跌近5%。</p>
