<h1>道指期货转涨 此前一度跌近1%</h1>
<p>财联社11月4日电，美股三大股指期货继续反弹，道琼斯指数期货转涨，此前一度跌近1%；纳斯达克100指数期货现跌0.4%，此前一度跌超2%；标普500指数期货现跌0.3%，此前一度跌超1%。</p>
