<h1>SpaceX三季度营收145.8亿美元 高于市场预期</h1>
<p>财联社10月21日电，SpaceX三季度营收145.8亿美元，同比增长161%，分析师预期128亿美元，其中太空业务营收17.7亿美元，市场预期14.3亿美元，AI收入75.6亿美元，市场预估63亿美元。公司三季度净利润44亿美元，分析师预期18.8亿美元，三季度每股收益0.35美元，预估0.15美元。公司三季度资本开支195.9亿美元，预期196亿美元。</p>
