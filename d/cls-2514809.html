<h1>10月26日午间涨停分析</h1>
<p>财联社10月26日电，今日午盘全市场共42股涨停，连板股总数10只，18股封板未遂，封板率为70%（不含ST股、退市股）。焦点股方面，大消费板块百洋股份12天8板、上海九百4连板，物理AI概念股福莱新材6天4板。</p>
