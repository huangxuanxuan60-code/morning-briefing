<h1>韩国KOSPI指数跌幅扩大至2% 三星电子跌近4%</h1>
<p>财联社10月29日电，韩国KOSPI指数跌幅扩大至2%，现报5891.35点。三星电子跌近4%，第三季度芯片利润不及预期。</p>
