<h1>美股盘前：AI硬件股票大幅上涨 英伟达涨3.6% SK海力士涨7.2%</h1>
<p>财联社11月11日电，美股盘前交易于17:00开始，AI硬件股票大幅上涨。英伟达涨3.6%，台积电涨4.3%，博通涨3.6%，SK海力士涨7.2%，AMD涨5.2%，美光涨5.2%，阿斯麦涨3.7%，英特尔、应用材料、甲骨文涨5%，泛林集团涨5.4%，lumentum涨8.4%，迈威尔科技涨6.5%，ARM涨6%，闪迪涨6.6%。</p>
