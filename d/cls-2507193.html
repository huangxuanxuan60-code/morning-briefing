<h1>苹果折叠手机iPhone Duo秒售罄 盘前涨超2%</h1>
<p>财联社10月16日电，苹果美股盘前涨超2%，开盘势创历史新高。苹果首款折叠屏手机iPhone Duo正式开售仅一分钟，全型号库存迅速售空。</p>
