<h1>苹果和阿里巴巴达成合作 千问集成到Apple智能</h1>
<p>《科创板日报》31日讯，苹果和阿里巴巴宣布达成合作，将千问集成至Apple智能，中国用户可以在Siri、写作工具及视觉智能中，直接调用千问的文本与图像理解、内容生成等能力。这些功能将于11月4日起随最新的iOS开发者Beta版开放测试，并将于12月iOS 27.3正式发布时面向中国用户推出。 （科创板日报记者 黄心怡）</p>
