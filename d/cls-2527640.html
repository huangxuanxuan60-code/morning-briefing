<h1>云南锗业：控股股东及一致行动人承诺12个月内不减持股份</h1>
<p>财联社11月6日电，云南锗业(002428.SZ)公告称，公司控股股东临沧飞翔及其一致行动人东兴集团自愿承诺，自2026年11月6日起12个月内不以任何形式减持所持公司股份。截至公告披露日，上述股东合计持有公司股份1.31亿股，占总股本的20.01%。</p>
