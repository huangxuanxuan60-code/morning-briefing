<h1>美民主党料近40年首获得州联邦参议院席位</h1>
<p>财联社11月4日电，美国选举数据分析机构决策台总部网站3日晚预测，得克萨斯州民主党联邦参议员候选人詹姆斯·塔拉里科将击败共和党候选人肯·帕克斯顿，成为1988年以来首名在该州赢得联邦参议院席位的民主党人。位于美国南部的得州是共和党传统票仓，过去三届总统选举中均支持特朗普。 （新华社）</p>
