<h1>港股午评：恒生指数涨1.21% 恒生科技指数涨2.09%</h1>
<p>财联社10月16日电，港股午间收盘，恒生指数涨1.21%，恒生科技指数涨2.09%。大型科网股集体反弹，阿里巴巴涨近4%，百度集团涨3%，京东、美团涨超2%，腾讯控股涨超1%。光通信、存储概念股反弹，均胜电子涨近11%，南方两倍做多三星电子涨超9%，南方两倍做多海力士涨逾8%，澜起科技涨近7%。</p>
