<h1>SK海力士预计存储供不应求持续至2030年</h1>
<p>财联社10月28日电，SK海力士表示，受先进制程技术难度提升及新建生产设施耗时较长等因素影响，存储市场供不应求格局预计将持续至2030年。公司计划加快扩产，预计第四季度HBM4在出货量和营收方面均将超过HBM3E；同时计划将321层NAND工艺占韩国本土产能的比重提升至50%以上，以增加高性能、大容量企业级固态硬盘供应。</p>
