<h1>马斯克旗下特斯拉和SpaceX双双重挫10%和7%</h1>
<p>财联社11月5日电，特斯拉股价下跌10.09%，报346.321美元/股，总市值报1.37万亿美元。SpaceX股价下跌7.41%，报125.845美元/股，总市值报1.71万亿美元。纳斯达克综合指数跌3.05%，报24951.1点。</p>
