<h1>国新投资有限公司Q3新进成为五矿发展第三大股东</h1>
<p>财联社10月30日电，据五矿发展2026年三季报显示，国新投资有限公司新进成为第三大股东，持有756.29万股，占总股本比例0.71%。小财注：7月19日晚间，中国国新、中国诚通两大国有资本运营公司公告，已合计斥资约600亿元增持A股。</p>
