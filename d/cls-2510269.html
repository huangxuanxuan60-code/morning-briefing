<h1>礼来股价创两个月最大涨幅 创历史新高</h1>
<p>财联社10月20日电，标普500指数下跌之际，礼来股价创两个月最大涨幅，最新上涨4.9%，报1301美元/股，总市值报1.22万亿美元，创历史新高。礼来周一宣布，在一项针对儿童溃疡性结肠炎患者的Omvoh注射剂后期试验取得成功后，公司计划寻求扩大该肠道疾病疗法的适应症。截止发稿，礼来盘中涨近4%，报1288.9美元，成交额3.21亿美元。</p>
