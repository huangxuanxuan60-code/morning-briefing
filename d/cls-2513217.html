<h1>首批18只主动ETF今日发售</h1>
<p>财联社10月23日电，国内首批18只主动管理交易型开放式证券投资基金也就是主动ETF，10月23日在沪深交易所发售。这是我国ETF市场二十多年发展进程中一次重要的产品创新，是进一步丰富资本市场公募产品供给，吸引中长期资金入市的重要举措。首批18只主动ETF，沪深交易所各落地9只，由华夏、南方、易方达、摩根等18家具备成熟投研能力的公募管理人发行。 （央视新闻）</p>
