<h1>独家|国有某大行计划向中国国新和中国诚通各新增千亿级股票回购增持专项贷款额度</h1>
<p>财联社11月1日电，财联社记者今日从相关渠道了解到，一家国有超大型银行近日计划向中国国新、中国诚通两家央企新增股票回购增持贷款额度，单家新增额度或可达到1000亿元。据悉，此次新增的再贷款额度规模，或将超过2024年该政策工具设立时该行向上述主体发放的首期额度。 （财联社记者 方彦博）</p>
