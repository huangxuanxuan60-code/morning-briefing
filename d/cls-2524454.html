<h1>美国六个州中期选举投票站已关闭 计票工作陆续展开</h1>
<p>财联社11月4日电，截至美国东部时间11月3日19时，美国中期选举投票持续进行，同时佐治亚州、肯塔基州、南卡罗来纳州、佛蒙特州、弗吉尼亚州和印第安纳州的投票站已全部关闭，投票结束。此外，佛罗里达州部分国会众议院选区的投票也已结束，该州其余地区的投票将于美国东部时间当天20时结束。随着各州投票站陆续关闭，相关选区的计票工作也将逐步展开。 （央视新闻）</p>
