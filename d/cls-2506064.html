<h1>美国9月PPI同比增长6.3% 远超市场预期</h1>
<p>财联社10月15日电，美国9月PPI同比增长6.3%，预估5.3%，前值5.4%。美国9月PPI环比增长1.3%，预估0.6%。</p>
