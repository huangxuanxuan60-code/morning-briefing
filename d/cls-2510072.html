<h1>富临精工：拟5亿元投建机器人智能电关节项目</h1>
<p>财联社10月20日电，富临精工(300432.SZ)公告称，公司及子公司四川班巧智能机器人有限公司与绵阳市涪城区人民政府签订投资协议，拟投资建设机器人智能电关节项目，计划总投资5亿元，分两期实施。一期投资2.5亿元，建设智能电关节及核心零部件产线，年产能预计200万套。</p>
