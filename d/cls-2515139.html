<h1>商务部就《保护中国商业秘密特别规定（征求意见稿）》公开征求意见</h1>
<p>财联社10月26日电，为了维护国家主权、安全、发展利益，保护中国权利人的合法权益，根据《中华人民共和国对外贸易法》等有关法律法规，商务部研究起草了《保护中国商业秘密特别规定（征求意见稿）》，现向社会公开征求意见。</p>
