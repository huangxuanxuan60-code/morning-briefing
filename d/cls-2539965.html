<h1>华泰证券辟谣：网传市场言论非公司研究所相关人员发表</h1>
<p>财联社11月20日电，华泰证券11月20日发布声明：我司关注到近期部分网络、境外平台传播的相关市场言论。经核实，该内容并非我司研究所相关人员发表，属于不实信息。我司所有证券研究观点，均严格按照监管要求履行内部审核流程后对外发布。请广大投资者理性甄别网络信息，不要采信、转发该不实内容。对于编造、传播不实信息的行为，我司支持当事人依法维护自身合法权益。</p>
