<h1>Anthropic将IPO价格定为每股83美元 高于推介区间</h1>
<p>财联社11月19日电，Anthropic的IPO定价为每股83美元，高于预期区间。将于11月19日在纳斯达克开始交易，本次发行包括约9.8亿股A类股票。</p>
