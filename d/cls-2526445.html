<h1>天赐材料：全资子公司与亿纬锂能签订45万吨电解液长期供货协议</h1>
<p>财联社11月5日电，天赐材料(002709.SZ)公告称，公司全资子公司九江天赐与亿纬锂能签订《长期供货协议》，约定2027年至2029年向亿纬锂能供应预计需求数量为45万吨的电解液产品，具体采购量、单价、质量标准等以双方确认的采购订单为准。协议有效期至2029年12月31日。</p>
