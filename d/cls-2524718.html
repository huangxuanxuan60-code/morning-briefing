<h1>美国媒体预计民主党夺回参议院重掌国会</h1>
<p>财联社11月4日电，美国媒体预测，民主党夺回美国国会参议院控制权。稍早前，美媒预测民主党夺回国会众议院控制权。这意味着本次中期选举后，民主党重新掌控国会。 （新华社）</p>
