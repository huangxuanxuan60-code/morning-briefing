<h1>证监会：同意首批18只主动ETF注册 为市场引入更多增量资金</h1>
<p>财联社10月19日电，证监会主席吴清在参加2026金融街论坛年会开幕式时表示，推动进一步健全适配长期投资的长周期考核机制，扩大中长期资金来源，渠道和入市方式，持续深化公募基金改革，壮大市场稳定力量。今天，证监会将同意首批18只主动ETF注册，这是推动基金产品创新发展的重要举措，也将为市场引入更多增量资金。</p>
