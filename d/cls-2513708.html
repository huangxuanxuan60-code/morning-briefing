<h1>澜起科技：完成本次A股回购方案 实际回购208.8万股耗资4.1亿元</h1>
<p>财联社10月23日电，澜起科技(688008.SH)公告称，此前披露，公司拟3亿元-6亿元回购股份。公司今日完成本次回购A股股份方案，实际回购208.80万股，占总股本0.17%，回购金额4.10亿元，回购价格区间184.14元/股至210.00元/股。回购股份用于维护公司价值及股东权益。</p>
