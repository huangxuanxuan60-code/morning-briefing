<h1>WTI原油期货涨幅扩大至3%</h1>
<p>财联社10月23日电，国际油价持续走高，WTI原油期货价格涨3.02%，报102.470美元/桶；布伦特原油期货价格涨2.47%，报115.967美元/桶。</p>
