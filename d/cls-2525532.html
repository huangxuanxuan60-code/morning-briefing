<h1>比特币、以太坊过去24小时分别大涨4%、6%</h1>
<p>财联社11月4日电，行情显示，比特币涨至80592.2美元，过去24小时内涨4.14%；行情显示，以太坊涨至2436.34美元，过去24小时内涨6.43%。</p>
