<h1>美股半导体板块遭遇重挫 费城半导体指数跌超5.6%</h1>
<p>财联社10月30日电，美股半导体板块大幅走低，费城半导体指数跌5.67%。个股方面，英特尔跌超26%，AMD跌超10%，闪迪跌8.38%，SK海力士跌6.93%，美光科技跌5%，英伟达跌2.51%，台积电跌3.69%。存储及半导体设备股普遍承压，三倍做多半导体ETF（SOXL）跌超20%。</p>
