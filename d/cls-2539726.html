<h1>沪指跌逾2%</h1>
<p>财联社11月20日电，指数走弱，沪指下挫跌逾2.00%，深成指跌2.68%，创业板指跌2.85%。有色金属、游戏传媒、军工、风电等方向跌幅居前，沪深京三市下跌个股近5300只。</p>
