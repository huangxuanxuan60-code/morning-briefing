<h1>品茗科技：因涉嫌操纵证券市场 实控人莫绪军遭证监会立案</h1>
<p>财联社11月3日电，品茗科技(688109.SH)公告称，公司控股股东、实际控制人莫绪军收到证监会下发的《立案告知书》，因涉嫌操纵证券市场，证监会决定对其立案。本次立案系对莫绪军个人的调查，其除担任公司名誉董事长外未参与日常经营管理，与公司经营无关，不会对公司产生重大影响，公司生产经营及财务状况正常。</p>
