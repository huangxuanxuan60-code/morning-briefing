<h1>马斯克：人形机器人将成为全球最大产业 明年年末有望实现Optimus对外交付</h1>
<p>财联社10月22日电，美东时间周三，特斯拉CEO马斯克在特斯拉财报电话会上表示，坚信人形机器人整个赛道都将成为全球最大的产业，未来地球上人形机器人的数量甚至会超过人类。他还预计，到明年年末，机器人AI、机电设计、可靠性以及使用寿命等一系列问题有望得到解决，“到那个时间点，我们才可以对外向特斯拉以外的企业交付Optimus。”</p>
