<h1>硬X射线自由电子激光装置实现首次出光</h1>
<p>财联社10月21日电，记者今天（10月21日）从上海科技大学获悉，近日，国家重大科技基础设施——硬X射线自由电子激光装置（简称SHINE）建设取得重要进展。装置采用4吉电子伏特（GeV）连续波超导直线加速器产生的电子束，驱动18台4米长、磁周期为55毫米的波荡器线，成功实现自由电子激光首次出光，向着2027年底建成投用迈出关键性一步。 （央视新闻）</p>
