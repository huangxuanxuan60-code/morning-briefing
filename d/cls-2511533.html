<h1>美股震荡上行 纳斯达克指数涨幅扩大至1%</h1>
<p>财联社10月21日电，美股震荡上行，道琼斯指数涨0.22%，标普500指数涨0.43%，纳斯达克综合指数涨1.00%。英伟达股价上涨1.71%，苹果股价上涨1.56%，SpaceX股价上涨9.97%，特斯拉股价上涨3.49%。Meta股价上涨2.49%，Palantir股价上涨3.52%，戴尔科技-C股价上涨4.41%。</p>
