<h1>甲骨文将谷歌TPU引入甲骨文云基础设施</h1>
<p>财联社10月28日电，甲骨文与谷歌宣布，谷歌的张量处理单元（TPU） 将首次在谷歌以外的超大规模云平台——甲骨文云基础设施（OCI） 上提供。OCI将负责提供电力、冷却和数据中心网络，以大规模部署谷歌TPU。</p>
