<h1>美股三大指数收盘涨跌不一 大型科技股多数下跌</h1>
<p>财联社10月21日电，美股三大指数收盘涨跌不一，道指涨1.02%，纳指跌0.02%，标普500指数涨0.29%，大型科技股多数下跌，苹果、谷歌、Meta跌超1%，SK海力士跌超2%，特斯拉涨超1%。生物制药、减肥药涨幅居前，礼来、安进涨超3%，阿斯利康涨近3%，诺和诺德、辉瑞涨超2%。半导体设备与材料、油气板块走低，科磊跌超2%，应用材料跌近2%，阿斯麦跌近1%。</p>
