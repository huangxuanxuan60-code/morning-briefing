<h1>美官员呼吁收紧对中国获取先进AI芯片的限制 外交部回应</h1>
<p>财联社11月11日电，外交部发言人郭嘉昆主持例行记者会。路透社记者提问，在涉及英伟达首席执行官黄仁勋的相关指控出现后，美国国会议员周二再次呼吁收紧对中国获取先进人工智能（AI）芯片的限制。外交部对此有何评论？“中方在美国输华芯片问题上的立场是一贯的。”郭嘉昆说。 （北京日报）</p>
