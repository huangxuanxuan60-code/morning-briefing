<h1>工信部等三部门联合调查有关车辆刹车踏板支架断裂问题</h1>
<p>财联社10月15日电，针对网络反映的“尊界V800汽车刹车踏板支架断裂问题”，工业和信息化部、中央网信办、市场监管总局高度重视，在前期调查工作基础上，成立联合调查组开展核查，并依法依规处理。有关情况将及时公布。 （工业和信息化部装备工业一司）</p>
