<h1>主动ETF首日发行  仅上午时段募集规模已超70亿</h1>
<p>财联社10月23日电，财联社记者从渠道了解到，首批18只主动ETF发售首日，仅上午合计募集规模已超70亿元。其中，摩根基金募集规模超15亿元，规模最大；富国、易方达或超10亿，三只均有望一日售罄。此外。华夏、大成、天弘、华泰柏瑞均在数亿规模。数千万或接近亿元规模的产品也不在少数。 （财联社记者 周晓雅）</p>
