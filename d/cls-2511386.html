<h1>泽连斯基：愿在保留至少75%领土控制权的基础上达成和平协议</h1>
<p>财联社10月21日电，乌克兰总统泽连斯基当地时间10月21日在接受采访时表示，乌方可在保留至少75%领土控制权的基础上达成和平协议。主持人向泽连斯基提问称，他是否愿意接受一项和平协议，把一切按现状冻结下来，乌方仍然保有75%或更多的国土。泽连斯基予以肯定回答，称“现在我们必须冻结（战线），这是结束这场战争的切实办法。” （央视新闻）</p>
