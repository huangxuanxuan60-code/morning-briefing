<h1>一箭十星 朱雀二号改进型遥四运载火箭发射成功</h1>
<p>财联社10月14日电，14日19时40分，朱雀二号改进型遥四运载火箭在东风商业航天创新试验区发射升空，将搭载的国星宇航星时代-39、44～50星，光传-03、04星共10颗卫星顺利送入预定轨道，飞行试验任务取得圆满成功。 （央视新闻）</p>
