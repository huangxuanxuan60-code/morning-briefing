<h1>行云科技：董事长提议回购2亿至3亿元股份</h1>
<p>财联社11月2日电，行云科技(300209.SZ)公告称，公司收到董事长、总经理张文提议，拟使用自有资金及/或自筹资金以集中竞价方式回购公司部分股份，回购资金总额不低于2亿元且不超过3亿元，回购股份可用于维护公司价值及股东权益或员工持股计划、股权激励。</p>
