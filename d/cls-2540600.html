<h1>美股再次走弱 费城半导体指数跌幅扩大至5%</h1>
<p>财联社11月20日电，美股再次走弱，费城半导体指数跌幅扩大至5%，报8946.81点。纳斯达克100指数跌幅扩大至1.5%，道琼斯指数涨0.58%，标普500指数跌0.53%，纳斯达克综合指数跌1.55%。</p>
