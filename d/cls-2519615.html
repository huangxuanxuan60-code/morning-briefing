<h1>美国9月核心PCE价格指数环比增长0.3% 符合市场预期</h1>
<p>财联社10月29日电，美国9月核心个人消费支出价格指数环比增长0.3%，预估为0.3%，前值为0.2%。同比增长3.1%，预估3.1%。</p>
