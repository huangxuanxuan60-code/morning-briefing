<h1>港股收盘：恒生科技指数收于4000点下方 宁德时代重挫超11%</h1>
<p>财联社10月21日电，港股高开低走，恒生科技指数收跌1.26%，报3994.77点，香港恒生指数收跌0.90%，报23651.87点。锂电池板块领跌，中创新航跌逾3%，赣锋锂业跌近4%，宁德时代跌逾11%，股价创2025年7月以来新低。权重科技股集体低迷，腾讯跌4%，美团跌近2%，小米跌近1%。存储概念股逆势走高，澜起科技涨近9%，兆易创新涨超3%。</p>
