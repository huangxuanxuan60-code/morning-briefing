<h1>天孚通信：控股股东提议1亿元至1.5亿元回购A股股份</h1>
<p>财联社10月15日电，天孚通信(300394.SZ)公告称，公司收到控股股东天孚仁和提议，拟使用自有或自筹资金通过集中竞价交易方式回购公司A股股份，回购资金总额不低于1亿元且不超过1.5亿元，回购价格上限不超过350元/股。本次回购股份拟全部注销并减少注册资本，回购期限为股东会审议通过方案之日起六个月内。</p>
