<h1>中汽协：10月新能源汽车销量194万辆 同比增长13.1%</h1>
<p>财联社11月11日电，中国汽车工业协会11日发布数据显示，2026年10月，新能源汽车产销分别完成201.7万辆和194万辆，同比分别增长13.8%和13.1%，新能源汽车月度新车销量占比持续提升，达到64.3%。10月，汽车产销分别完成306.3万辆和301.6万辆，环比分别增长2.5%和2%。</p>
