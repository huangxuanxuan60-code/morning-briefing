<h1>三环集团：拟5亿元至10亿元回购公司股份</h1>
<p>财联社11月4日电，三环集团(300408.SZ)公告称，公司拟使用自有资金或自筹资金以集中竞价方式回购部分A股股份，回购资金总额不低于5亿元且不超过10亿元，回购价格不超过100元/股，用于维护公司价值及股东权益。</p>
