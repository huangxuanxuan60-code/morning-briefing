<h1>谷歌云Vera Rubin基础设施计划扩展至多站点96万颗Rubin GPU</h1>
<p>财联社10月21日电，谷歌云计划将基于英伟达Vera Rubin的基础设施扩展至多站点部署、最多96万颗Rubin GPU。伦敦人工智能公司Ineffable Intelligence已率先接入A5X实例，用于大规模强化学习及持续学习系统研发。该公司由AlphaGo创作者David Silver创立。</p>
