<h1>香港恒生科技指数收跌2.72% 光通信、半导体板块领跌</h1>
<p>财联社10月15日电，香港恒生指数收跌1.03%，恒生科技指数跌2.72%。光通信、半导体板块跌幅居前，长飞光纤光缆跌超13%，天数智芯跌超13%，壁仞科技跌超11%，澜起科技跌超11%，海光芯正跌超8%，剑桥科技跌8%，华虹宏力跌近8%，中际旭创跌超7%，中芯国际跌近4%；大模型股走低，智谱跌超10%，MINIMAX跌超12%；联想集团跌超14%。</p>
