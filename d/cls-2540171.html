<h1>鹏鼎控股：控股股东提议未来三年每年股东回报不低于15亿元</h1>
<p>财联社11月20日电，鹏鼎控股(002938.SZ)公告称，公司控股股东美港实业提议，2026至2028三个会计年度内，每年股东回报总额不低于15亿元，且不低于该年度净利润的30%，两项标准以孰高者为准。美港实业承诺在相关议案审议时投赞成票。该提议尚需董事会及股东会审议，存在不确定性。</p>
