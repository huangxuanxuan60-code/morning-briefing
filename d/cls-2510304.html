<h1>道指涨幅扩大至1% 芯片股多数转涨</h1>
<p>财联社10月20日电，美股三大指数走高，道指涨幅扩大至1%。截至目前，道琼斯指数涨1.04%，标普500指数涨0.53%，纳斯达克综合指数涨0.31%。芯片股多数抹去盘初跌幅转涨，英伟达股价上涨0.29%，台积电股价上涨1.05%，美光科技股价上涨0.64%，AMD股价上涨0.89%。</p>
