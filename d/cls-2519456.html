<h1>旷达科技：拟5.01亿元投建电子玻纤材料一期项目 规划高性能电子布年产能3500万米</h1>
<p>财联社10月29日电，旷达科技(002516.SZ)公告称，公司全资子公司常州市旷达电子材料有限公司拟投资建设高性能电子玻纤材料项目(一期)，预估总投资5.01亿元，规划形成年产高性能电子布约3500万米及配套电子纱的一体化生产能力。项目建设期10个月。</p>
