<h1>礼来第三季度营收同比增长39%至244亿美元 上调全年营收指引</h1>
<p>财联社10月29日电，礼来第三季度营收243.97亿美元，同比增长39%；净利润64.51亿美元，同比增长16%；调整后每股收益7.48美元，同比增长7%。公司将2026年全年营收指引上调至910亿至920亿美元，较此前指引中值提高55亿美元；全年调整后每股收益指引为35至36美元。</p>
