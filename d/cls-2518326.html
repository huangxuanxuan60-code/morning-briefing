<h1>美股三大指数集体高开 SK海力士涨超8%</h1>
<p>财联社10月28日电，美股三大指数集体高开，道琼斯指数涨0.05%，标普500指数涨0.16%，纳斯达克综合指数涨0.22%。受SK海力士财报影响，存储股多数上涨。SK海力士涨超8%，闪迪涨超4%，美光科技涨超3%，西部数据涨约1%。恩智浦半导体跌超6%，此前公司预计第四季度销售额低于预期。新东方跌超7%，其第一财季净营收同比增长23.1%，净利润增长13.5%。</p>
