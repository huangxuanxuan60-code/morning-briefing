<h1>11月10日午间涨停分析</h1>
<p>财联社11月10日电，今日午盘全市场共51股涨停，连板股总数12只，21股封板未遂，封板率为71%（不含ST股、退市股）。焦点股方面，商业航天概念股阳光照明14天8板，短剧概念股文投控股15天8板，机器人概念股襄阳轴承14天7板，冰雪产业概念股冰山冷热9天5板。</p>
