<h1>美光科技在存储股中率先转涨 此前一度跌超6%</h1>
<p>财联社10月15日电，美光科技在存储股中率先转涨，此前一度跌超6%。其他存储股也收窄跌幅，截至发稿，SK海力士ADR跌2.00%；闪迪跌2.51%，西部数据跌4.33%，希捷科技跌4.57%，铠侠ADR跌5.68%。</p>
