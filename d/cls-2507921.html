<h1>国家统计局：1—9月全国房地产开发投资同比下降20.6%</h1>
<p>财联社10月19日电，国家统计局数据显示，1—9月份，全国房地产开发投资53364亿元，同比下降20.6%；其中，住宅投资41125亿元，下降20.5%。1—9月份，新建商品房销售面积56483万平方米，同比下降13.2%；其中住宅销售面积下降13.8%。新建商品房销售额53799亿元，下降13.9%；其中住宅销售额下降13.7%。</p>
