<h1>道琼斯指数涨幅扩大至1% 30只成分股中24只上涨</h1>
<p>财联社10月15日电，美股低开高走，道琼斯指数涨1%，标普500指数涨0.1%；纳斯达克综合指数跌0.28%，此前最多下跌1.4%。道指成分股多数上涨，30只成分股中24只上涨，耐克涨5.35%、赛富时涨4.70%、家得宝涨3.84%，消费及医疗股表现强势。科技股走势分化，思科跌4.42%、英伟达跌2.10%，微软、谷歌和苹果则小幅上涨。</p>
