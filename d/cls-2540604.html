<h1>费城半导体指数跌幅扩大至6%</h1>
<p>财联社11月20日电，费城半导体指数跌幅扩大至6%，报8846.94点。闪迪跌超12%，希捷科技、西部数据跌超9%，ARM跌超8%，应用材料、AMD、拉姆研究、博通跌超7%，英伟达跌超5%。</p>
