<h1>美国长端国债收益率跌幅扩大 20年期和10年期收益率日内跌逾14个基点</h1>
<p>财联社10月15日电，美国国债收益率集体下行，长端收益率跌幅居前。行情数据显示，美国20年期国债收益率报5.434%，日内下跌14.6个基点；30年期国债收益率报5.385%，日内下跌14.1个基点；10年期国债收益率报5.054%，日内下跌13.6个基点。美国7年期国债收益率日内下跌13.5个基点，5年期国债收益率下跌11.5个基点。</p>
