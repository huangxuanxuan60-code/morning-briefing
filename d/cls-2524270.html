<h1>山鹰国际：因涉嫌内幕交易和短线交易 实控人及董事长吴明武被证监会立案</h1>
<p>财联社11月3日电，山鹰国际(600567.SH)公告称，公司实际控制人、董事长吴明武收到证监会《立案告知书》，因涉嫌内幕交易和短线交易，证监会决定对其立案。本次立案系针对吴明武个人，与公司日常经营管理和业务活动无关，不会对公司生产经营活动产生影响。</p>
