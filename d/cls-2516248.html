<h1>创业板指跌逾1% 科创50跌近2%</h1>
<p>财联社10月27日电，指数走弱，创业板指下挫跌逾1%，沪指跌0.24%，深成指跌0.67%，科创50指数跌近2%。医药生物、军工、软件服务、锂电池等方向跌幅居前，沪深京三市下跌个股近4200只。</p>
