<h1>商务部：继续暂停对韩华海洋株式会社5家美国相关子公司实施反制措施2个月</h1>
<p>财联社11月9日电，据商务部公告，为落实中美经贸磋商共识，现公布《关于继续暂停对韩华海洋株式会社5家美国相关子公司实施反制措施2个月的决定》，自2026年11月10日起施行。</p>
