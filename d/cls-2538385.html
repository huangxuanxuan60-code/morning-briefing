<h1>现货黄金跌幅扩大至3% 触及一年多来最低水平</h1>
<p>财联社11月19日电，现货黄金价格跌3.02%，报3732.79美元/盎司，触及一年多来最低水平；现货白银价格跌5.09%，报44.97美元/盎司。</p>
