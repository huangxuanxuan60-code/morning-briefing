<h1>英伟达推出面向高性能计算的Vera CPU机架级平台</h1>
<p>财联社11月17日电，英伟达今日宣布推出面向高性能计算的Vera CPU机架级平台。Vera为智能体科学带来更高性能，能效比x86 CPU提升一倍。完整的Vera CPU平台将由戴尔科技、HPE、联想和Supermicro提供。</p>
