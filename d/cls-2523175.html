<h1>美官员：美俄乌三方会谈将于10日至11日举行</h1>
<p>财联社11月3日电，美国高级官员当地时间11月2日透露，美国将于11月10日至11日在阿联酋阿布扎比与乌克兰和俄罗斯举行三方会谈。该官员表示，三方会谈将涵盖结束冲突、战后安全安排、局势降温以及援助措施等议题。美国官员本周将在布鲁塞尔与来自法国、德国、英国、欧盟及北约的代表会晤，讨论乌克兰相关问题。 （央视新闻）</p>
