<h1>微软启动10批次美元高等级债券发行 为2017年以来首次</h1>
<p>财联社10月29日电，微软启动10批次美元高等级债券发行，为2017年以来首次。微软盘前涨幅收窄至1%，此前一度涨超4%。</p>
