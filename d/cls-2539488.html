<h1>交易员押注三大央行利率将在数年内保持高位</h1>
<p>财联社11月20日电，交易员押注主要央行在2027年底结束加息后，将在数年内基本维持利率不变。根据利率期货定价，预计未来12个月美联储、欧洲央行和英国央行都将进一步加息，此后至少到2031年基本按兵不动。</p>
