<h1>国内能化板块期货大幅跳水 聚丙烯、纯苯、丙烯触及跌停</h1>
<p>财联社11月10日电，国内能化板块期货大幅跳水，聚丙烯、纯苯、丙烯触及跌停，液化气跌超7%，燃料油、原油、甲醇跌超6%，苯乙烯、聚乙烯、沥青跌超5%，PTA、乙二醇、瓶片跌超3%。</p>
