<h1>两只宽基ETF午后显著放量 创业板ETF易方达（159915）成交额突破100亿</h1>
<p>财联社10月29日电，据财联社盯盘数据显示，午后两只宽基ETF显著放量，创业板ETF易方达（159915）成交额突破100亿，科创50ETF华夏（588000）成交超83亿。此外A500ETF华泰柏瑞（563360）成交超56亿，已超上一日全天成交额。</p>
