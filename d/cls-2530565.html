<h1>Anthropic：IPO目标市值约1万亿美元 下周三确定发行价、周四开始交易</h1>
<p>财联社11月10日电，Anthropic表示，计划在纳斯达克IPO，目标市值约1万亿美元；预计IPO将于下周三确定发行价格，并于下周四开始交易。</p>
