<h1>银行间主要利率债收益率升幅扩大</h1>
<p>财联社10月30日电，银行间主要利率债收益率升幅扩大，10年期国债活跃券260016收益率上行2.9bp报1.64%，30年期国债活跃券2600004收益率上行4.1bp报2.094%，10年期国开活跃券260205收益率上行3.5bp报1.693%。</p>
