<h1>美股存储板块跌势加剧 闪迪跌超11% 希捷跌近10%</h1>
<p>财联社11月5日电，美股存储板块持续遭遇抛售，费城半导体指数跌5.82%。个股方面，闪迪跌幅扩大至11.00%，西部数据跌9.44%，希捷科技跌9.99%，SK海力士跌7.93%，美光科技跌7.03%。存储板块主要个股跌幅均接近或超过7%。</p>
