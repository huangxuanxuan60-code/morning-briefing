<h1>国际原油期货跳水 美油布油均跌超3%</h1>
<p>财联社11月9日电，国际原油期货跳水，WTI原油期货价格跌3.38%，报87.759美元/桶；布伦特原油期货价格跌3.72%，报94.660美元/桶。</p>
