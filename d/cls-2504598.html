<h1>央行：前三季度人民币贷款增加11.52万亿元</h1>
<p>财联社10月14日电，央行数据显示，前三季度人民币贷款增加11.52万亿元。分部门看，住户贷款减少1.03万亿元，其中，短期贷款减少1.14万亿元，中长期贷款增加1062亿元；企（事）业单位贷款增加12.55万亿元，其中，短期贷款增加4.64万亿元，中长期贷款增加6.53万亿元，票据融资增加1.24万亿元；非银行业金融机构贷款减少5865亿元。</p>
