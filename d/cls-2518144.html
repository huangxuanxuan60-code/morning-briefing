<h1>8000亿元新型政策性金融工具投放完成</h1>
<p>财联社10月28日电，记者从国开行、进出口银行、农发行三家政策性银行获悉，截至10月28日，2026年新型政策性金融工具全部完成投放，共计8000亿元。其中，国开新型政策性金融工具、进银新型政策性金融工具、农发新型政策性金融工具分别投放3650亿元、1200亿元、3150亿元。 （央视新闻）</p>
