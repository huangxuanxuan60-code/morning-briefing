<h1>北证50涨超4%</h1>
<p>财联社10月20日电，北交所个股走强，北证50指数拉升涨超4%。消息面上，证监会将锚定打造服务创新型中小企业主阵地，稳步推出北证50ETF、北交所新股市值配售、创新性评价标准、优化新三板分层管理等一系列举措，促进北交所新三板一体化高质量发展。</p>
