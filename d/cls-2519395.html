<h1>中微公司：董事长提议回购4亿至5亿元股份</h1>
<p>财联社10月29日电，中微公司(688012.SH)公告称，公司董事长尹志尧提议公司使用自有资金通过集中竞价交易方式回购部分A股股份，回购资金总额不低于4亿元且不超过5亿元，回购股份拟用于员工股权激励、员工持股计划或减少注册资本，回购价格不高于董事会审议通过回购方案前30个交易日股票交易均价的150%。</p>
