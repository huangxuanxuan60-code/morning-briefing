<h1>苹果、微软、谷歌、亚马逊单日市值合计增加超1万亿美元</h1>
<p>财联社11月4日电，苹果涨5.87%，单日增加市值约2816亿美元；微软涨6.24%，增加约2397亿美元；谷歌A股涨4.09%，增加约2790亿美元；亚马逊涨7.79%，增加约2095亿美元。四家公司合计增加市值约1.01万亿美元。</p>
