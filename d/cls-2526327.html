<h1>高新兴：控股子公司创联科技终止北交所上市辅导备案</h1>
<p>财联社11月5日电，高新兴(300098.SZ)公告称，公司控股子公司创联科技基于未来战略规划考虑，经与申万宏源友好协商，双方同意终止北交所上市辅导协议，并于2026年11月4日签订终止协议。申万宏源同日向浙江证监局撤回上市辅导备案申请。该事项无需公司董事会及股东会审议，对生产经营不会产生重大影响。</p>
