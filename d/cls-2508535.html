<h1>潘功胜：将推出非银机构大额赎回流动性支持工具</h1>
<p>财联社10月19日电，在2026金融街论坛年会开幕式上，中国人民银行行长潘功胜表示，将会同金融监管总局、中国证监会推出非银机构大额赎回流动性支持工具。 （央视财经）</p>
