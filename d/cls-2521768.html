<h1>央行将召开股票回购增持再贷款座谈会</h1>
<p>财联社11月1日电，据业内人士透露，下周一央行将与金融监管总局、证监会召集各大银行开会，研究优化股票回购增持再贷款政策。业内猜测，此次会议大概率是金融管理部门为进一步稳定市场做准备。 （财联社记者 李婷）</p>
