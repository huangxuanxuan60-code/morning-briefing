<h1>沪电股份：拟5亿元至10亿元回购公司部分A股股份</h1>
<p>财联社11月9日电，沪电股份(002463.SZ)公告称，公司拟使用自有资金或自筹资金，以集中竞价交易方式回购公司部分A股股份，回购资金总额不低于5亿元且不超过10亿元，回购价格不超过156.70元/股。回购股份总数的50%用于实施员工持股计划或股权激励，另50%用于维护公司价值及股东权益。</p>
