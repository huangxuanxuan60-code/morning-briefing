<h1>英伟达停止向中国供应H200芯片 外交部回应</h1>
<p>财联社11月18日电，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，英伟达的临时CEO称，将不再向中国出货H200芯片。中方对此有何评论？郭嘉昆表示，中方此前已经多次阐明在美国输华芯片问题上的原则立场。 （北京日报）</p>
