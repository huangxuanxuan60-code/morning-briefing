<h1>报道称英伟达董事会没有在考虑让黄仁勋重任CEO</h1>
<p>财联社11月17日电，据报道，知情人士称，英伟达董事会没有在考虑让黄仁勋回公司担任CEO。董事会目前专注于调查，并未讨论让黄仁勋回归。</p>
