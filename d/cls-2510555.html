<h1>宁德时代低开5% 股价创2025年7月以来新低</h1>
<p>财联社10月21日电，早盘宁德时代低开5%，股价创2025年7月以来新低，A+H股总市值降至1.16万亿元。消息面上，10月20日晚，宁德时代披露2026年第三季度报告。公司第三季度归母净利润同比增长14.54%；单季度综合毛利率降至20.69%，连续两个季度回落。</p>
