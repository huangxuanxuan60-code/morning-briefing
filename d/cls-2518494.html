<h1>沃什：美联储会议日程将从明年秋季起变化 2027年将有一次会议不进行利率投票</h1>
<p>财联社10月29日电，美联储主席沃什表示，联邦公开市场委员会的日程安排将从明年秋季开始变化。2027年有一次会议既不进行利率投票，也不发布政策声明。预计2028年有两次FOMC会议不进行利率投票。</p>
