<h1>央行：9月末广义货币（M2）余额359.63万亿元 同比增长7.2%</h1>
<p>财联社10月14日电，据央行数据，9月末，广义货币（M2）余额359.63万亿元，同比增长7.2%。狭义货币（M1）余额116.76万亿元，同比增长3.2%。流通中货币（M0）余额15.02万亿元，同比增长10.6%。前三季度净投放现金9221亿元。</p>
