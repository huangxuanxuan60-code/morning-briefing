<h1>美股存储巨头延续下跌 美光总市值超越SK海力士</h1>
<p>财联社10月16日电，美股存储巨头延续下跌，美光科技股价下跌4.26%，报891.570美元/股，总市值报1.01万亿美元。SK海力士股价下跌5.52%，为连续9个交易日下跌，现报138.050美元/股，总市值报1.008万亿美元。</p>
