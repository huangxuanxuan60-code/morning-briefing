<h1>江苏雷利：因涉嫌信息披露、减持违法违规 实控人苏达被证监会立案</h1>
<p>财联社11月4日电，江苏雷利(300660.SZ)公告称，公司实际控制人、董事、总经理苏达于2026年11月4日收到证监会《立案告知书》，因涉嫌信息披露、减持违法违规，证监会决定对其立案。本次调查仅针对苏达个人，公司各项业务及经营管理正常，不会对董事会运作及日常经营产生重大影响。</p>
