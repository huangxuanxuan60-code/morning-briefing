<h1>南卫股份：实控人李平因涉嫌内幕交易罪被刑事拘留</h1>
<p>财联社11月15日电，南卫股份(603880.SH)公告称，公司于2026年11月15日收到实控人李平家属通知，李平因2023年在公开市场的减持被公安以涉嫌内幕交易罪于近日刑事拘留，案件正在调查中。截至公告披露日，公司控制权未发生变化，李平未在公司担任任何职务，公司董事和高级管理人员均正常履职。</p>
