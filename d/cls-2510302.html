<h1>美油布油均跌超2% 盘中曾一度上涨2%</h1>
<p>财联社10月20日电，国际油价快速下行，布伦特原油期货跌幅扩大至2%，报107.281美元/桶，盘中曾一度上涨2.3%。WTI原油期货跌幅扩大至2%，报96.56美元/桶，盘中曾一度上涨2%。</p>
