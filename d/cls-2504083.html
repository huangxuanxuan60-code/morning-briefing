<h1>国家统计局：9月PPI同比上涨5.0% 环比上涨1.2%</h1>
<p>财联社10月14日电，国家统计局数据显示，2026年9月份，全国工业生产者出厂价格同比上涨5.0%，环比上涨1.2%。工业生产者购进价格同比上涨6.9%，环比上涨1.2%。1—9月平均，工业生产者出厂价格比上年同期上涨2.3%，工业生产者购进价格上涨3.6%。</p>
