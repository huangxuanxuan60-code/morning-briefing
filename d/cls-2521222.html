<h1>英伟达股价下跌3.3% 总市值跌破5万亿美元</h1>
<p>财联社10月30日电，英伟达股价下跌3.3%，报206.610美元/股，总市值报4.98万亿美元。月初以来，英伟达股价累计下跌超9%，跌至8月初以来的最低水平。</p>
