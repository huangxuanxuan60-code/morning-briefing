<h1>英特尔跌30%市值蒸发近1500亿美元 四季度盈利指引不及预期</h1>
<p>财联社10月30日电，英特尔美股开盘后持续走低，现跌超30%，报64.400美元/股，总市值报3420亿美元，总市值蒸发近1500亿美元。公司第三季度营收165亿美元，同比增长21%，非GAAP每股收益0.52美元。但公司预计第四季度非GAAP每股收益仅0.25美元，毛利率预计降至38%，低于第三季度的44.1%，盈利前景引发市场担忧。</p>
