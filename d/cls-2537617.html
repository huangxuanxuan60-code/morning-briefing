<h1>创业板指、深成指双双跌逾1%</h1>
<p>财联社11月18日电，指数再度走弱，创业板指下挫跌逾1.00%，沪指跌0.59%，深成指跌1.04%。贵金属、短剧、军工、机器人、光伏、食品等方向跌幅居前，沪深京三市下跌个股近4700只。</p>
