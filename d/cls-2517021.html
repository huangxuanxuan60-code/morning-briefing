<h1>美股存储概念股涨幅扩大 西部数据涨超7%</h1>
<p>财联社10月27日电，美股存储概念股涨幅扩大，西部数据涨超7%，希捷科技涨超4%，闪迪涨超3%，SK海力士、美光科技涨超1%。消息面上，马斯克坚定看好内存需求，称机器人所需内存将超过其他任何领域。</p>
