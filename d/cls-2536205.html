<h1>高位人气股持续低迷 大东方等多股3连跌停</h1>
<p>财联社11月17日电，高位人气股今早持续低迷，大东方、百洋股份、永臻股份、闽发铝业走出3连跌停，东方环宇、金辰股份、日出东方、海洋王连续2日跌停。</p>
