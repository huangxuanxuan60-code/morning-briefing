<h1>阳光电源：累计回购530.11万股耗资5亿元 成交价70.42元/股-114.99元/股</h1>
<p>财联社11月20日电，阳光电源(300274.SZ)公告称，截至2026年11月20日，公司通过集中竞价方式累计回购股份530.11万股，占总股本0.2557%，成交最高价114.99元/股，最低价70.42元/股，支付资金总额5亿元。本次回购符合公司回购方案及相关法规要求。</p>
