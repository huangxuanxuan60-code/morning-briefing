<h1>佰维存储：拟2亿元至2.5亿元回购股份 用于减少注册资本</h1>
<p>财联社10月30日电，佰维存储(688525.SH)公告称，公司拟以自有资金及或自筹资金(含回购专项贷款资金)通过集中竞价交易方式回购股份，回购金额不低于2亿元且不超过2.5亿元，回购价格不超过269.47元/股，回购股份将用于减少注册资本。本次回购方案尚需提交股东会审议，实施期限为股东会审议通过后12个月内。</p>
