<h1>恒生科技指数跌幅扩大至3%</h1>
<p>财联社10月22日电，恒生科技指数下跌3%至3875.09点。阿里巴巴跌4.6%，京东集团跌超3%，小米集团、腾讯控股跌超2%。</p>
