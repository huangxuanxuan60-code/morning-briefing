<h1>纳斯达克100指数期货抹去此前高达2.4%的跌幅</h1>
<p>财联社11月4日电，纳斯达克100指数期货抹去此前高达2.4%的跌幅。目前，道琼斯指数期货涨0.44%，标普500指数期货涨0.14%。</p>
