<h1>纳指期货涨1% 部分科技股夜盘反弹</h1>
<p>财联社11月6日电，纳斯达克100指数期货涨幅扩大至1%，此前一度跌超1%。部分科技股夜盘反弹，闪迪美股夜盘涨逾6%，AMD、美光科技夜盘涨超5%，英伟达夜盘涨2.4%。</p>
