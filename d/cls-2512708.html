<h1>纳指低开1.55% Meta跌超4%</h1>
<p>财联社10月22日电，美股三大指数开盘下跌，道琼斯指数跌0.44%，标普500指数跌0.91%，纳斯达克综合指数跌1.55%。芯片设备制造商泛林集团给出的业绩展望令人失望，其股价低开逾9%。特斯拉削减支出计划后，股价下跌2.8%。Meta跌超4%，公司未来支出承诺总额达8250亿美元。IBM跌超4%，公司第三季度营收171亿美元，同比增长4.7%。</p>
