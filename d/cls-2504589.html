<h1>银行间主要利率债收益率尾盘降幅扩大</h1>
<p>财联社10月14日电，银行间主要利率债收益率尾盘降幅扩大，30年期国债“26超长特别国债04”收益率下行2.25bp报2.0615%，10年期国债“26附息国债16”收益率下行1.5bp报1.642%，10年期国开债“26国开05”收益率下行2.5bp报1.701%。</p>
