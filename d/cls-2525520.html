<h1>道指、纳指均涨超2% 苹果、微软、亚马逊涨5%-7%</h1>
<p>财联社11月4日电，道琼斯指数涨2.38%，标普500指数涨1.71%，纳斯达克综合指数涨2.09%。市值最大的5只股票中，苹果股价上涨5.56%，英伟达股价下跌0.13%，微软股价上涨5.42%，谷歌-A股价上涨3.43%，亚马逊股价上涨7.33%。</p>
