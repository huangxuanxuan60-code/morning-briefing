<h1>中基健康：法院裁定受理公司及子公司重整 11月4日起被实施退市风险警示股票简称变更为“*ST中基”</h1>
<p>财联社11月2日电，中基健康(000972.SZ)公告称，公司收到法院裁定，受理债权人对公司及子公司红色番茄的重整申请，并指定管理人。公司股票将于11月3日停牌一天，自11月4日起复牌并被实施退市风险警示，股票简称变更为“*ST中基”。</p>
