<h1>Anthropic上半年营收163亿美元 去年同期为12亿美元</h1>
<p>财联社10月26日电，Anthropic上半年营收163亿美元，去年同期为12亿美元；上半年总运营费用为169.8亿美元；上半年净亏损807亿美元。</p>
