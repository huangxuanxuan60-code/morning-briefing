<h1>美国10月CPI环比增长0.4% 高于市场预期</h1>
<p>财联社11月10日电，美国10月消费者价格指数（CPI）环比增长0.4%，预估为0.3%，前值为0.6%。美国劳工统计局表示，受去年政府停摆影响，不会公布10月CPI同比数据。</p>
