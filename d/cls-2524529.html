<h1>纳斯达克100指数期货跌幅扩大至2%</h1>
<p>财联社11月4日电，早期投票结果显示，美国民主党人在中期选举中势头领先。美股三大期指持续走低，纳斯达克100指数期货跌幅扩大至2%，标普500指数期货跌0.9%，道指期货跌0.4%。</p>
