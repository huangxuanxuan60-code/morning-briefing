<h1>纳斯达克100指数跌幅扩大至4% 费城半导体指数跌8.7%</h1>
<p>财联社10月31日电，纳斯达克100指数跌幅扩大至4%，刷新日低。费城半导体指数跌8.7%，英特尔现跌30.8%，闪迪跌15%，AMD、高通、ARM跌12%，希捷科技跌超9%，西部数据、应用材料跌超8%，Cerebras、阿斯麦、拉姆研究跌超7%，台积电、博通跌超6%。</p>
