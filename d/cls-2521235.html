<h1>费城半导体指数跌幅扩大至6%</h1>
<p>财联社10月30日电，费城半导体指数跌幅扩大至6%。英伟达股价下跌3.24%，台积电股价下跌3.83%，博通股价下跌5.04%，美光科技股价下跌4.46%，超威半导体股价下跌9.48%，英特尔股价下跌29.6%，ARM股价下跌10.18%。</p>
