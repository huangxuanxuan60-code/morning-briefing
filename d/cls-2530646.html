<h1>青岛食品：控股股东拟9.65亿元转让29.24%股权 青啤集团将成新控股股东</h1>
<p>财联社11月10日电，青岛食品(001219.SZ)公告称，公司控股股东华通集团拟将所持5701.76万股股份(占总股本29.24%)协议转让给青啤集团，转让总价9.65亿元。交易完成后，青啤集团将成为控股股东，实控人变更为青岛市国资委。</p>
