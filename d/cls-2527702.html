<h1>国际复材：拟投资11.58亿元建设高性能电子纤维布项目</h1>
<p>财联社11月6日电，国际复材(301526.SZ)公告称，拟投资11.58亿元建设高性能电子纤维布(龙山)项目，其中建设投资11.26亿元，铺底流动资金2023.6万元，建设期利息1215.9万元。项目建设年产1.11亿米电子级玻璃纤维布，建设期限为2026年11月至2027年9月。</p>
