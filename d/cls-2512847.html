<h1>纳斯达克100指数跌幅扩大至3% 热门科技股纷纷下挫</h1>
<p>财联社10月23日电，纳斯达克100指数跌幅扩大至3%，标普500指数现跌1.5%，热门科技股纷纷下挫，泛林集团跌超11%，闪迪、科磊、迈威科技跌超9%，希捷科技、SpaceX跌超8%，Meta、AMD、Arm、英特尔、应用材料、西部数据跌超7%，阿斯麦跌超6%，美光科技跌超5%，亚马逊、英伟达、博通跌超4%。</p>
