<h1>天邦食品：与通威集团签署重整投资协议 投资款总额14.41亿元</h1>
<p>财联社11月9日电，天邦食品(002124.SZ)公告称，公司确定通威集团为重整产业投资人并签署《重整投资协议》。通威集团拟以0.98元/股受让14.70亿股转增股份，投资款总额14.41亿元。通威集团承诺取得股份后60个月内不转让。重整完成后，预计通威集团将成为公司控股股东。</p>
