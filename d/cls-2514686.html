<h1>博索纳罗拒绝承认在巴西总统选举第二轮投票中败选</h1>
<p>财联社10月26日电，巴西自由党候选人、前总统雅伊尔·博索纳罗之子弗拉维奥·博索纳罗拒绝承认在总统选举第二轮投票中败选。他表示，将要求宣布选举无效。 （央视新闻）</p>
