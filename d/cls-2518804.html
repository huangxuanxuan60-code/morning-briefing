<h1>银行板块持续走高 四大行总市值突破10万亿</h1>
<p>财联社10月29日电，银行板块盘中持续走高，“工农中建”四大行均涨超1%，A+H股总市值历史首次突破10万亿，其中，工商银行总市值2.94万亿元，建设银行2.35万亿元，农业银行2.58万亿元，中国银行2.15万亿元。</p>
