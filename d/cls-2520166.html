<h1>闪迪：将100%的盈余现金返还给股东 第一财季已投入50亿美元用于股票回购</h1>
<p>财联社10月30日电，闪迪管理层美东时间周四在2027财年第一财季电话会议上表示，本季度营收增长中“约60%归功于销量增长，40%归功于价格上涨。”基于强劲的订单可见度，闪迪预计第二财季营收将在122亿至126亿美元之间，同时，公司承诺将100%的盈余现金返还给股东，本财季已豪掷50亿美元用于股票回购。</p>
