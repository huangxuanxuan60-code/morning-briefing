<h1>恒生科技指数上涨3%</h1>
<p>财联社11月2日电，恒生科技指数上涨3%至3,867.68点。成分股中，地平线机器人涨超8%，小米集团涨逾7%，MINIMAX-W涨近7%，美团、腾讯控股涨超3%，阿里巴巴、中芯国际涨近3%。</p>
