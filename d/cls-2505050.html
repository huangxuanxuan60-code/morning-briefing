<h1>费城半导体指数跌幅扩大至4%</h1>
<p>财联社10月15日电，费城半导体指数跌幅扩大至4%，存储概念现跌4.4%，迈威尔科技跌6%，AMD、Arm跌超5%，英特尔跌超4%，英伟达、美光科技、科磊跌超3%，博通跌近3%。</p>
