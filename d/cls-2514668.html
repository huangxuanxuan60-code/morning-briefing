<h1>创业板指跌逾2% 下跌个股近2900只</h1>
<p>财联社10月26日电，指数走弱，创业板指下挫跌逾2%，沪指跌0.30%，深成指跌1.11%。算力硬件、贵金属、影视传媒、半导体芯片等方向跌幅居前，沪深京三市下跌个股近2900只。</p>
