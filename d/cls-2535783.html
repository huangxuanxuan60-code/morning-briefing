<h1>胜宏科技：拟1.5亿元至3亿元回购公司股份</h1>
<p>财联社11月16日电，胜宏科技(300476.SZ)公告称，公司拟使用自有或自筹资金以集中竞价方式回购公司股份，回购资金总额不低于1.5亿元且不超过3亿元，回购价格不超过240.49元/股。回购股份将用于股权激励或员工持股计划，回购期限为董事会审议通过之日起不超过12个月。</p>
