<h1>英伟达股价创2025年6月以来新低 总市值降至3.36万亿美元被谷歌超越</h1>
<p>财联社11月20日电，英伟达股价跌幅扩大至4.5%，报139.430美元/股，股价创2025年6月以来新低。英伟达11月累计下跌32%，总市值降至3.36万亿美元，被谷歌超越，位列美股第四。截至发稿，谷歌股价上涨2.27%，报278.850美元/股，总市值报3.43万亿美元。</p>
