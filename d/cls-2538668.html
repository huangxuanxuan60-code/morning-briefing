<h1>恒生指数跌超2% 腾讯控股跌超6%</h1>
<p>财联社11月19日电，港股持续走低，恒生指数跌2.03%；恒生科技指数跌2.31%。科技龙头延续走弱，智谱跌7.08%；腾讯控股跌6.22%；百度集团跌5.63%；快手-W跌5.24%；阿里巴巴跌5.40%；京东健康跌4.70%；美团-W跌4.13%；小鹏集团跌4.10%；联想集团跌4.07%。</p>
