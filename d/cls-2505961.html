<h1>存储芯片美股盘前走低 SK海力士跌近8%</h1>
<p>财联社10月15日电，美股存储芯片概念股盘前集体走低，其中SK海力士（SKHY）跌超7.8%，西部数据（WDC）、希捷科技（STX）、闪迪（SNDK）及美光科技（MU）跌幅均超5%。</p>
