<h1>国新投资Q3新进成为福能股份第五大股东</h1>
<p>财联社10月27日电，据福能股份三季报显示，国新投资有限公司新进成为第五大股东，持有4327.77万股，占总股本比例1.56%。小财注：7月19日晚间，中国国新、中国诚通两大国有资本运营公司公告，已合计斥资约600亿元增持A股。</p>
