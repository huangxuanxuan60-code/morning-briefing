<h1>上交所对浙文影业下发监管工作函</h1>
<p>财联社11月6日电，上交所发布关于浙文影业集团股份有限公司有关股价波动事项的监管工作函。浙文影业因股价波动事项被监管关注。监管工作函涉及对象为上市公司。</p>
