<h1>11月6日午间涨停分析</h1>
<p>财联社11月6日电，今日午盘全市场共26股涨停，连板股总数10只，11股封板未遂，封板率为70%（不含ST股、退市股）。焦点股方面，“羊”字辈的东方海洋13天8板、阳光照明12天7板，光伏概念股闽发铝业5连板，短剧概念股浙文影业5连板。</p>
