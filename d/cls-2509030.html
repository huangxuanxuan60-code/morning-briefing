<h1>纳斯达克100指数涨幅扩大至2% SK海力士、英特尔等涨超6%</h1>
<p>财联社10月19日电，美股半导体板块走强，费城半导体指数日内涨3.43%，现报1151点。台积电股价上涨3.48%，SK海力士股价上涨6%，美光科技股价上涨5.35%，英特尔股价上涨6.05%，泛林集团股价上涨6.03%。纳斯达克100指数涨幅扩大至2%；标普500指数上涨0.9%。</p>
