<h1>SpaceX美股盘前大涨超9% 马斯克称2027年底前ARR有望达5000亿至1万亿美元</h1>
<p>财联社10月21日电，SpaceX美股盘前涨超9%，公司Q3业绩优于市场预期。马斯克表示，有信心在2027年实现10吉瓦算力上线，2027年底前公司年度经常性收入（ARR）有望达5000亿至1万亿美元。</p>
