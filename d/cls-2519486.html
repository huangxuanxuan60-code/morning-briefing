<h1>国新宏盛投资(北京)有限公司新进成为中国联通第九大股东</h1>
<p>据中国联通(600050.SH)2026年三季报显示，国新宏盛投资(北京)有限公司新进成为第九大股东，持有15632.16万股，占总股本比例0.50%。小财注：7月19日晚间，中国国新、中国诚通两大国有资本运营公司公告，已合计斥资约600亿元增持A股。</p>
