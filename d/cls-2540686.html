<h1>纳指尾盘跌幅扩大至5% 恐慌指数升破36</h1>
<p>财联社11月21日电，道琼斯指数跌1.72%，标普500指数跌3.45%，纳斯达克综合指数跌5.09%。VIX指数升破36，触及2025年4月以来最高盘中水平。</p>
