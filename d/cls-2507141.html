<h1>申昊科技：子公司签订8.81亿元算力设备采购合同</h1>
<p>财联社10月16日电，申昊科技(300853.SZ)公告称，公司全资子公司申昊智算与B公司签订《销售合同》，含税总金额8.81亿元，占公司最近一个会计年度经审计主营业务收入100%以上。合同标的为算力设备。</p>
