<h1>美股三大股指期货齐拉升收窄跌幅</h1>
<p>财联社11月20日电，临近美股开盘，美股三大股指期货齐拉升收窄跌幅。纳斯达克100指数期货跌幅由2.3%收窄至1%，道琼斯指数期货转涨，标普500指数期货跌幅由1.3%收窄为0.4%。</p>
