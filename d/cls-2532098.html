<h1>英伟达据悉在与外部公司合作物色CEO候选人</h1>
<p>财联社11月12日电，据报道，知情人士透露，英伟达董事会在与一家外部公司合作，物色首席执行官黄仁勋的潜在接班人。知情人士称，董事会正在考虑先任命一位临时负责人，同时寻觅正式人选。</p>
