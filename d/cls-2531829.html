<h1>我国成功发射探源计划探路者卫星</h1>
<p>财联社11月11日电，11月11日19时41分，我国在酒泉卫星发射中心使用长征二号丁运载火箭，成功将探源计划探路者卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。这次任务是长征系列运载火箭的第677次飞行。 （央视新闻）</p>
