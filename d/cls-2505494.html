<h1>创业板指跌逾4%</h1>
<p>财联社10月15日电，指数持续走弱，创业板指下挫跌逾4.00%，沪指跌2.42%，深成指跌3.28%。算力硬件、半导体芯片、煤炭、油气等方向跌幅居前，沪深京三市下跌个股近5200只。</p>
