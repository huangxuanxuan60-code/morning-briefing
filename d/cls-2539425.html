<h1>利弗莫尔中概股龙头指数涨幅扩大至2% 拼多多涨近13%</h1>
<p>财联社11月19日电，利弗莫尔中概股龙头指数涨幅扩大至2%，报8167.68点。成分股中，拼多多涨12.7%，富途涨8%，脑再生科技涨5.33%，阿里巴巴涨4.22%，慧荣科技涨4.01%。</p>
