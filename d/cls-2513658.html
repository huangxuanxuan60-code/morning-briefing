<h1>三安光电：实控人林秀成被检察机关批准逮捕</h1>
<p>财联社10月23日电，三安光电(600703.SH)公告称，此前披露，公司实际控制人林秀成因涉嫌职务侵占、挪用资金罪被公安机关刑事拘留，近日收到其家属通知，林秀成被检察机关批准逮捕。目前公司生产经营管理正常，林秀成自2017年7月10日以来未在公司担任任何职务，该事项与公司无关，不会对公司生产经营产生重大影响。</p>
