<h1>鸿海：预计全年业绩将超出此前预期 向好趋势将延续至明年</h1>
<p>财联社11月12日电，鸿海表示，自8月财报电话会议以来，全年业务能见度有所改善，上调四大主要产品线的前景展望；预计全年业绩将超出此前预期，向好趋势将延续至明年；基于当前客户需求，对2027年业务前景非常有信心，预计将持续增长。</p>
