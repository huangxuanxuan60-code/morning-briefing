<h1>Anthropic据悉第三季度营收跃升至168亿美元</h1>
<p>财联社10月15日电，据报道， 知情人士透露，Anthropic PBC告诉潜在投资者，其第三季度营收达到168亿美元。知情人士称，Anthropic在旧金山总部举行的一场演示会上告诉投资者，第三季度按调整后口径实现盈利。</p>
