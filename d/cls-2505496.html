<h1>台积电第三季度净利润7630.6亿新台币 同比大增68.7%</h1>
<p>财联社10月15日电，台积电公布截至2026年9月30日的第三季度财报显示，合并营收1.49424万亿新台币，同比增长50.9%，环比增长17.6%，净利润7630.6亿新台币，同比大增68.7%，环比增长8.0%，市场预估7394.9亿元台币。</p>
