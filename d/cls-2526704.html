<h1>美股恐慌指数VIX飙升逾62% 突破27点关口</h1>
<p>财联社11月5日电，美国股市波动率急剧攀升，标普500波动率指数（VIX）报27.03点，大涨10.42点，涨幅达62.73%，盘中最高触及27.03点，距离52周高点35.30点进一步收窄。与此同时，美股三大指数集体下跌，道指跌2.38%，标普500指数跌3.57%，纳指综合指数跌5.35%。</p>
