<h1>证监会：中国资产的配置价值更加凸显</h1>
<p>财联社10月19日电，证监会主席吴清在参加2026金融街论坛年会开幕式时表示，中国宏观政策发力提效，创新动能不断释放，中国经济向新向优、长期向好的支撑条件和基本趋势依然强劲，资本市场运行底层逻辑已悄然发生深刻变化，中国资产的配置价值更加凸显。</p>
