<h1>行云科技：中标项目补充协议总金额上调至88.48亿元 上调约35.64%</h1>
<p>财联社10月26日电，行云科技(300209.SZ)公告称，公司全资子公司悦云树与V客户就后续批次设备租金标准及起租方式签署补充协议，对应协议总金额上涨至88.48亿元，上调约35.64%，同时调整分批起租规则。本次补充协议为原合同不可分割组成部分，与原合同具备同等法律效力。</p>
