<h1>美股市值前十公司盘初罕见全线下跌 英伟达、苹果等集体承压</h1>
<p>财联社10月20日电，美股市值前十公司股价全线下跌，英伟达跌1.12%，苹果跌0.47%，谷歌A、谷歌C均跌0.39%，微软跌0.30%，亚马逊跌0.09%，台积电跌0.20%，SpaceX跌2.22%，Meta跌2.36%，博通跌0.54%。其中，Meta、SpaceX跌幅居前。</p>
