<h1>巴西股指期货恢复交易 最新下跌20%</h1>
<p>财联社10月26日电，巴西股指期货恢复交易，下跌20%，触及交易限制。此前，巴西总统选举第二轮投票最终计票结果公布，卢拉赢得连任。</p>
