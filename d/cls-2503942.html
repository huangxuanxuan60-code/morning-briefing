<h1>美中央司令部：霍尔木兹海峡由美军及地区伙伴掌控</h1>
<p>财联社10月14日电，美军中央司令部在社交平台上发文回应伊朗伊斯兰革命卫队有关霍尔木兹海峡的表态。美军中央司令部称，目前霍尔木兹海峡由美军及地区伙伴掌控。美方还表示，美国军队前一天协助海湾地区伙伴将超过1900万桶原油经霍尔木兹海峡运出。伊朗伊斯兰革命卫队海军司令当天称，将击沉任何接近霍尔木兹海峡的美国军舰。 （央视新闻）</p>
