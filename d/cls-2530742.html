<h1>台积电、博通涨超2% 二者相继收复11月5日暴跌以来全部失地</h1>
<p>财联社11月10日电，周二美股盘中，半导体板块持续反弹，台积电美股（TSM）报396.49美元，涨幅2.03%；博通（AVGO）报330.99美元，涨幅3.60%。两只股票均已收复11月5日大跌以来的全部失地。其中，台积电11月5日单日下跌约10.78%，博通下跌约10.43%。截至目前，两家公司股价均已回升至暴跌前水平上方。</p>
