<h1>韩国KOSPI指数高开3.46% SK海力士涨逾6%</h1>
<p>财联社10月27日电，韩国KOSPI指数开盘上涨3.46%，Anthropic提交IPO文件给芯片股带来提振，SK海力士涨逾6%，三星电子涨超4%。日经225指数高开0.61％，报62569.08点。</p>
