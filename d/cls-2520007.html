<h1>韩国KOSPI指数低开3% SK海力士跌近6%</h1>
<p>财联社10月30日电，韩国KOSPI指数开盘下跌2.99%，报5760.35点。SK海力士跌近6%，三星电子跌近2%。日经225指数低开0.49%，报64344.37点。</p>
