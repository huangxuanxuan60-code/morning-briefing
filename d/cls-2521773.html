<h1>ST合纵：收到证监会立案告知书</h1>
<p>财联社11月1日电，ST合纵(300477.SZ)公告称，公司于2026年10月30日收到证监会下发的《立案告知书》，因涉嫌信息披露违法违规，证监会决定对公司立案。立案调查期间，公司将积极配合相关工作，并按规定履行信息披露义务。</p>
