<h1>中国诚通控股集团有限公司新进成为华大九天第八大股东</h1>
<p>财联社10月29日电，据华大九天(301269.SZ)三季报显示，中国诚通控股集团有限公司新进成为第八大股东，持有1020万股，占总股本比例1.86%。小财注：7月19日晚间，中国国新、中国诚通两大国有资本运营公司公告，已合计斥资约600亿元增持A股。</p>
