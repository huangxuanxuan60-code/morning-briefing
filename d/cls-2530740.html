<h1>英伟达盘中跌至170美元：较52周高点回撤30% 市值最多蒸发约1.76万亿美元</h1>
<p>财联社11月10日电，截至11月10日美股盘中，英伟达股价最低跌至170.24美元，较52周高点243.37美元下跌约30.1%。按约241亿股总股本估算，英伟达市值较高点最多蒸发约1.76万亿美元，折合约1.76万亿美元。截至发稿时，英伟达报170.485美元，跌幅4.58%。</p>
