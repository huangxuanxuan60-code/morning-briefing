<h1>英伟达股价收窄跌幅至5%以内 总市值重新触及4万亿美元</h1>
<p>财联社11月12日电，抄底资金涌入，英伟达股价收窄跌幅至4.5%左右，报165.880美元/股，总市值报4.00万亿美元；此前一度大跌14%，市值蒸发近6000亿美元。</p>
