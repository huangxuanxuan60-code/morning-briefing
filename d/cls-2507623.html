<h1>海光信息：董事长提议回购5亿至8亿元股份</h1>
<p>财联社10月18日电，海光信息(688041.SH)公告称，公司董事长历军提议以自有资金通过集中竞价交易方式回购公司股份，回购资金总额不低于5亿元且不超过8亿元，回购股份将用于员工持股计划或股权激励。提议人历军在提议前6个月内不存在买卖公司股份情况，回购期间无增减持计划。</p>
