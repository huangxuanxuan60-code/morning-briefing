<h1>韩国KOSPI指数跌幅扩大至4% SK海力士跌超6%</h1>
<p>财联社10月20日电，韩国KOSPI指数跌幅扩大至4%，现报5536.97点。SK海力士跌超6%，三星电子跌近3%。</p>
