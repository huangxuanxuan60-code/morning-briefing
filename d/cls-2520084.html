<h1>亚马逊CEO：预计AWS未来两年收入同比增速都将高于40% 5-10年有望成长为万亿美元营收规模业务</h1>
<p>财联社10月30日电，美东时间周四盘后，亚马逊首席执行官安迪・贾西在亚马逊财报电话会上，对其AWS云业务前景绘制了极为宏大的前景。他表示：“AWS的年化收入已达1840亿美元，但发展机遇依然巨大……我们预计AWS 2027、2028每年同比增速都将高于40%，未来5-10年有望成长为万亿美元营收规模业务。”</p>
