<h1>李强将访问泰国并赴菲律宾出席中国—东盟领导人会议</h1>
<p>财联社11月11日电，外交部发言人宣布：应泰国总理阿努廷邀请，国务院总理李强将于11月13日至15日对泰国进行正式访问。应东盟轮值主席国菲律宾总统马科斯邀请，国务院总理李强将于11月15日至16日赴菲律宾马尼拉出席第29次中国—东盟领导人会议。</p>
