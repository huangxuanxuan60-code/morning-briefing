<h1>云南锗业：高品质磷化铟单晶片项目投资额增至2.7亿元</h1>
<p>财联社11月17日电，云南锗业(002428.SZ)公告称，公司董事会审议通过议案，同意将控股子公司云南鑫耀实施的“高品质磷化铟单晶片建设项目”总投资额由1.89亿元增加至2.7亿元。因项目建设期间部分机器设备及安装调试费用市场价格上涨，同时为顺应市场大尺寸需求，调整部分设备配置及数量，合计增加投资8143万元。</p>
