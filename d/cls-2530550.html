<h1>Anthropic：截至今年10月底 年化营收约为810亿美元</h1>
<p>财联社11月10日电，Anthropic表示，截至2026年10月31日，其年化营收约为810亿美元，较2026年9月30日增加100亿美元。年付费超10万美元的客户数量增长至11,900家。</p>
