<h1>甲骨文将2030财年长期营收目标定在2250亿美元以上</h1>
<p>财联社10月29日电，甲骨文重申对2027财年营收至少达到900亿美元的预期。甲骨文预计2029财年资本支出将下降。甲骨文将2030财年长期营收目标定在2250亿美元以上。甲骨文预计2029财年自由现金流达300亿美元。甲骨文股价短线拉升，现涨6.7%。</p>
