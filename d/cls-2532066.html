<h1>英伟达盘后跌逾3% 黄仁勋据悉曾与下属高管有婚外情</h1>
<p>财联社11月12日电，英伟达股价在盘后交易中下跌逾3%，此前报道称英伟达首席执行官黄仁勋与一名向其汇报工作的公司高管有过婚外情。报道称，黄仁勋与英伟达的医疗保健业务副总裁Kimberly Powell有过一段关系。今年3月英伟达举行一场会议期间，两人在加利福尼亚州圣何塞一家酒店被拍到举止亲密。</p>
