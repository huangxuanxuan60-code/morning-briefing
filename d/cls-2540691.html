<h1>纳斯达克100指数收盘暴跌5.6% 市值蒸发2.1万亿美元 抹去今年以来的涨幅</h1>
<p>财联社11月21日电，纳斯达克100指数收盘暴跌5.6%，市值蒸发2.1万亿美元，本周收盘较10月纪录高点下跌19.8%。该指数抹去今年以来的涨幅，年迄今表现转为下跌0.9%。</p>
