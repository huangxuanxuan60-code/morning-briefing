<h1>SK海力士计划2026年股东回报总规模100万亿韩元</h1>
<p>财联社10月28日电，据监管文件显示，SK海力士计划2026年至少派发30万亿韩元现金股息，并至少回购和注销60万亿韩元股票。股份回购包括近期完成的40万亿韩元股票回购。</p>
