<h1>纳斯达克100指数期货跌幅扩大至2%</h1>
<p>财联社10月30日电，纳斯达克100指数期货跌幅扩大至2%。最新触发因素包括亚马逊的大规模资本支出数字、英特尔因个人电脑处理器需求疲软发布低于预期的销售预测。这进一步加剧了投资者对AI热潮融资成本高昂以及这些巨额投资能否获得回报的担忧。</p>
