<h1>奥精医疗：涉嫌定期报告等财务数据虚假记载 公司被证监会立案</h1>
<p>财联社11月1日电，奥精医疗(688613.SH)公告称，公司于2026年11月1日收到证监会《立案告知书》，因涉嫌定期报告等财务数据虚假记载，证监会决定对公司立案。若后续经行政处罚认定触及重大违法强制退市情形，公司股票将被实施重大违法强制退市。目前公司经营管理正常，将积极配合调查并履行信息披露义务。</p>
