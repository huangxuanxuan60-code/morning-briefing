<h1>11月17日午间涨停分析</h1>
<p>财联社11月17日电，今日午盘全市场共42股涨停，连板股总数7只，7股封板未遂，封板率为86%（不含ST股、退市股）。焦点股方面，商业航天概念股阳光照明14天8板，零售板块广百股份4连板，端侧AI概念股瀛通通讯6天4板。</p>
