<h1>亨通光电：控股股东拟增持4亿至6亿元股份</h1>
<p>财联社11月4日电，亨通光电(600487.SH)公告称，公司控股股东亨通集团计划自公告披露之日起12个月内，通过上交所系统以集中竞价方式增持公司股份，拟增持金额不低于4亿元且不超过6亿元。截至公告披露日，亨通集团持有公司股份5.94亿股，占总股本的24.07%。</p>
