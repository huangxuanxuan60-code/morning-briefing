<h1>国家发改委：正在研究制定扩大内需战略实施方案</h1>
<p>财联社10月20日电，国家发展改革委国民经济综合司副司长左刚20日在新闻发布会上表示，正在研究制定扩大内需战略实施方案，并将加快推动印发实施。下一步国家发展改革委将会同有关部门以更大力度更实举措有效扩大内需。</p>
