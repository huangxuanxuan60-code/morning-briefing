<h1>央行于今日开展了1000亿元证券、基金、保险公司互换便利操作 中标费率为10bp</h1>
<p>财联社11月3日电，央行官网发布证券、基金、保险公司互换便利（SFISF）操作结果公告 [2026]第1号，根据参与机构需求情况，中国人民银行于2026年11月3日开展了证券、基金、保险公司互换便利操作。本次操作金额1000亿元，采用费率招标方式，31家证券、基金公司参与投标，中标费率为10bp。</p>
