<h1>创业板指跌逾1% 短剧方向领跌</h1>
<p>财联社11月17日电，指数走弱，创业板指下挫跌逾1.04%，沪指跌0.52%，深成指跌0.73%。短剧、光伏、算力硬件等方向跌幅居前，沪深京三市下跌个股近4200只。</p>
