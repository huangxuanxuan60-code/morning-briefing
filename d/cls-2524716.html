<h1>美民主党有望自1932年以来首次夺得堪萨斯州联邦参议院席位</h1>
<p>财联社11月4日电，据选举预测机构决策台总部（DDHQ）美东时间3日预测，民主党人亚当·汉密尔顿有望击败现任共和党参议员罗杰·马歇尔，使堪萨斯州的美国参议院席位转由民主党掌控。分析认为，这标志着该党自1932年以来首次在该州赢得参议院席位，也是在多场竞争激烈的参议院竞选中取得的一项重大胜利。 （央视新闻）</p>
