<h1>10月14日涨停分析</h1>
<p>财联社10月14日电，今日全市场共36股涨停，连板股总数15只，24股封板未遂，封板率为60%（不含ST股、退市股）。焦点股方面，传媒板块新华文轩13天9板、慈文传媒4连板、新经典4连板，鱼粉概念股百洋股份4连板。</p>
