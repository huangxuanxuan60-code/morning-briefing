<h1>中科曙光：董事长提议3亿元至5亿元回购公司股份</h1>
<p>财联社10月18日电，中科曙光(603019.SH)公告称，公司董事会收到董事长、总经理历军提议，拟使用自有资金以集中竞价交易方式回购公司A股股份，回购资金总额不低于3亿元、不超过5亿元，回购股份拟用于员工股权激励或员工持股计划。</p>
