<h1>纳斯达克100指数跌幅扩大至3.5% 费城半导体指数跌8%</h1>
<p>财联社10月31日电，纳斯达克100指数跌幅扩大至3.5%，刷新日低。费城半导体指数跌8%，报10596.08点。英特尔现跌30%，闪迪跌13%，AMD、高通、ARM跌11%，希捷科技、应用材料跌超8%，西部数据、拉姆研究跌超7%。</p>
