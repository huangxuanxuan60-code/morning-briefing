<h1>力箭二号遥二运载火箭发射成功</h1>
<p>北京时间2026年11月3日8时15分，力箭二号遥二运载火箭在东风商业航天创新试验区发射升空，将搭载的千帆极轨21组卫星顺利送入预定轨道，飞行试验任务取得圆满成功。此次任务是力箭二号运载火箭的第2次飞行。 （央视新闻）</p>
