<h1>韩国KOSPI指数跌幅扩大至8% 7个交易日累计下跌约21%</h1>
<p>财联社10月15日电，韩国KOSPI指数跌幅扩大至8%，该指数已连续7个交易日下跌，累计下跌约21%。SK海力士跌超11%，三星电子跌近10%。</p>
