<h1>夜盘期货收盘：沪铜下挫近5% 沪锌跌超3%</h1>
<p>国际铜夜盘收跌4.59%，沪铜收跌4.96%，沪铝收跌1.98%，沪锌收跌3.30%，沪铅收跌0.22%，沪镍收跌2.96%，沪锡收跌3.70%。氧化铝夜盘收涨0.15%，铝合金收跌1.73%。不锈钢夜盘收跌1.98%。</p>
