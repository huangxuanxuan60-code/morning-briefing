<h1>欧洲央行行长拉加德将于2027年2月7日卸任</h1>
<p>财联社10月29日电，欧洲中央银行今天宣布，欧洲央行行长拉加德将提前卸任。拉加德告诉工作人员，她计划于2月7日卸任。</p>
