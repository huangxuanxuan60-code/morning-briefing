<h1>国机精工第二大股东国新投资有限公司三季度增仓346.71万股</h1>
<p>财联社10月29日电，国机精工(002046.SZ)发布2026年三季报显示，与2026年半年报相比，第二大股东国新投资有限公司持仓增加346.71万股至2213.68万股，占总股本比例4.13%。小财注：7月19日晚间，中国国新、中国诚通两大国有资本运营公司公告，已合计斥资约600亿元增持A股。</p>
