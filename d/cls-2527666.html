<h1>沪电股份：董事长提议5亿至10亿元回购A股股份</h1>
<p>财联社11月6日电，沪电股份(002463.SZ)公告称，公司董事会收到董事长陈梅芳提议，拟以集中竞价交易方式回购公司A股股份，回购资金总额不低于5亿元且不超过10亿元，回购股份将用于员工持股计划或股权激励、减少注册资本或维护公司价值及股东权益。提议人在提议前6个月内不存在买卖公司股份情况。</p>
