<h1>国产卫星互联网首次实现北极、南极、青藏高原联网通信</h1>
<p>财联社10月19日电，记者19日从正在执行中国第16次北冰洋考察任务的“极地”号获悉，该船已完成国产卫星互联网北极航线准业务化应用测试，本航次首次成功开展北极、南极、青藏高原联网通信验证，打通了全球通信“最后的盲区”。 （央视新闻）</p>
