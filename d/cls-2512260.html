<h1>港股收盘：恒生科技指数跌5% 锂电池股继续走低</h1>
<p>财联社10月22日电，恒生科技指数收跌5.03%，报3793.93点；香港恒生指数收跌3.03%，报22934.68点。光通信板块领跌，长飞光纤光缆跌近12%，中际旭创跌超7%，剑桥科技跌超11%。大型科网股集体下挫，阿里巴巴跌超6%，小米集团跌超3%，腾讯控股跌近3%。锂电池股继续走低，宁德时代跌超7%，中创新航跌超4%。</p>
