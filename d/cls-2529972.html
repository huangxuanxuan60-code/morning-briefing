<h1>台积电10月销售额同比增长59.7% 环比增长14.7%</h1>
<p>财联社11月10日电，台积电10月销售额5,868.9亿元台币，同比增长59.7%，环比增长14.7%。台积电2026年1月至10月的收入总计为44856.2亿新台币，较2025年同期增长43.3%。</p>
