<h1>工商银行：向特定对象发行A股股票申请获上交所审核通过</h1>
<p>财联社11月11日电，工商银行(601398.SH)公告称，公司于2026年11月11日收到上交所出具的审核意见，认为公司向特定对象发行股票申请符合发行条件、上市条件和信息披露要求。该事项尚需经证监会同意注册后方可实施，最终能否获得注册决定及其时间尚存在不确定性。</p>
