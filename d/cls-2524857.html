<h1>中韩半导体ETF华泰柏瑞（513310）成交超262亿 刷新历史天量</h1>
<p>财联社11月4日电，中韩半导体ETF华泰柏瑞（513310）午后涨超6%，成交额突破262亿元，刷新此前在2026年7月29日创下的259.8亿元的成交额历史纪录。</p>
