<h1>前三季度我国工业机器人产量同比增长29.1%</h1>
<p>财联社10月19日电，国家统计局副局长毛盛勇19日在国新办新闻发布会上说，前三季度我国装备制造业和高技术制造业支撑明显，工业机器人产量同比增长29.1%，3D打印设备、锂离子电池产量同比分别增长62.5%、39.5%。</p>
