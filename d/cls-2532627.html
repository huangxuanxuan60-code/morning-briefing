<h1>11月12日涨停分析</h1>
<p>财联社11月12日电，今日全市场共37股涨停，连板股总数11只，35股封板未遂，封板率为51%（不含ST股、退市股）。焦点股方面，大消费板块东方海洋17天9板、大东方8天6板，冰雪经济概念股龙江交通11天6板，医疗板块澳洋健康12天6板，光伏概念股日出东方5连板。</p>
