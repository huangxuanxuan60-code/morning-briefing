<h1>纳指低开0.6% 存储板块延续跌势</h1>
<p>财联社10月14日电，美股三大指数集体低开，道指跌0.19%，纳指跌0.6%，标普500指数跌0.41%。存储板块延续跌势，海力士跌3.9%，闪迪跌2.9%，西部数据跌1.9%，美光科技跌1.7%。美国银行大跌7.6%，其第三季度盈利未达预期。</p>
