<h1>腾讯第三季度资本开支同比增长约527%至814亿元 预估554亿元</h1>
<p>财联社11月18日电，腾讯控股公告，第三季度资本开支814.33亿元，预估554亿元，上年同期为129.83亿元；今年前三季度资本开支1661.53亿元，同比增长约179%。资本开支主要用于IT基础设施、数据中心、土地使用权、办公园区及知识产权等。腾讯控股第三季度自由现金流为负691亿元。</p>
