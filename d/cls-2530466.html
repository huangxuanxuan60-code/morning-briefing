<h1>美联储理事沃勒：并非超级偏鹰 不会把利率提高150或200个基点</h1>
<p>财联社11月10日电，美联储理事沃勒表示，美国10月CPI环比上涨0.3%将表明通胀正偏离目标，需要采取更激进的政策行动。我认为，短期内不会看到人工智能带来广泛的生产率提升。沃勒表示，并非超级偏鹰，我们不想重创经济，至少需要收回此前三次预防性降息；不会把利率提高150或200个基点。</p>
