<h1>中国石油第四大股东国新宏盛投资(北京)有限公司三季度增仓3.73亿股</h1>
<p>财联社10月28日电，中国石油(601857.SH)发布2026年三季报显示，与2026年半年报相比，第四大股东国新宏盛持仓增加3.73亿股至13.86亿股，占总股本比例0.76%。小财注：7月19日晚间，中国国新、中国诚通两大国有资本运营公司公告，已合计斥资约600亿元增持A股。</p>
