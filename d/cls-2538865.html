<h1>国内商品期货大面积收跌 苹果跌超7%</h1>
<p>财联社11月19日电，国内商品期货大面积收跌，苹果跌超7%，沪铜跌超5%，国际铜、沪锡跌超4%，沪银、沪镍、液化气、丙烯、乙二醇、棕榈油、铂、红枣跌超3%，沪金、橡胶、聚乙烯、20号胶、多晶硅、生猪跌超2%。涨幅方面，集运欧线涨超4%，碳酸锂、豆一、螺纹钢小幅收涨。</p>
