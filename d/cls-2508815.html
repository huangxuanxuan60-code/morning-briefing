<h1>鹏鼎控股：拟以3亿元至5亿元回购公司股份</h1>
<p>财联社10月19日电，鹏鼎控股(002938.SZ)公告称，公司拟使用自有资金或自筹资金以集中竞价方式回购股份，回购资金总额不低于3亿元且不超过5亿元，回购价格不超过80元/股。回购股份将用于员工持股计划或股权激励计划，实施期限为自董事会审议通过之日起12个月内。</p>
