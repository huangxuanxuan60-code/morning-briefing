<h1>美国10年期、30年期国债收益率日内跌6个基点</h1>
<p>财联社10月13日电，美国30年期国债收益率日内跌6个基点，现报5.536%，已连跌4日。美国10年期国债收益率日内跌6个基点，现报5.176%。</p>
