<h1>SpaceX首次实现“筷子夹飞船”</h1>
<p>财联社11月15日电，SpaceX星舰第十五次试飞的上面级飞船返回得克萨斯州星港，在完成着陆点火和姿态翻转后，成功被发射塔“筷子”机械臂捕获。这是SpaceX首次成功捕获从地球轨道返回的星舰上面级飞船，为实现星舰完全、快速重复使用迈出关键一步。此次飞船此前已完成26颗第三代星链卫星部署，但超重型助推器回收未能成功，因此本次任务未实现两级全部回收。</p>
