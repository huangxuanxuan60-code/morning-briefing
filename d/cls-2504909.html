<h1>交易员押注美联储至2027年1月底前至少加息两次 概率升至73.7%</h1>
<p>财联社10月14日电，CME FedWatch工具显示，交易员预计美联储至2027年1月底前至少加息两次的概率合计为73.7%。其中，届时联邦基金利率目标区间升至4.25%—4.50%的概率为48.9%，升至4.50%—4.75%的概率为24.8%；维持当前3.75%—4.00%区间的概率仅为1.2%。</p>
