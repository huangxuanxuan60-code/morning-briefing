<h1>中科曙光：拟3亿元至5亿元回购股份用于员工持股计划或股权激励</h1>
<p>财联社10月27日电，中科曙光(603019.SH)公告称，公司拟以自有资金及金融机构借款，通过集中竞价交易方式回购股份，回购金额不低于3亿元且不超过5亿元，回购价格不超过117.01元/股。本次回购的股份拟用于员工持股计划或股权激励，回购期限为董事会审议通过之日起12个月内。</p>
