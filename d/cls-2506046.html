<h1>拓荆科技：董事长提议回购2亿元至3亿元股份</h1>
<p>财联社10月15日电，拓荆科技(688072.SH)公告称，公司董事长吕光泉提议公司使用自有资金以集中竞价交易方式回购公司股份，回购资金总额不低于2亿元且不超过3亿元，回购股份拟用于员工股权激励/员工持股计划或减少注册资本。</p>
