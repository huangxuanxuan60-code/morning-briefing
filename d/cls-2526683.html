<h1>美股存储板块跌势进一步扩大 闪迪跌超17% 美光跌逾12%</h1>
<p>财联社11月5日电，美股存储板块持续遭遇抛售，费城半导体指数跌8.31%。个股方面，闪迪跌幅扩大至17.09%，铠侠ADR跌15.20%，美光科技跌12.57%，西部数据跌13.48%，希捷科技跌13.43%，SK海力士跌10.80%。存储芯片及硬盘产业链全线重挫。</p>
