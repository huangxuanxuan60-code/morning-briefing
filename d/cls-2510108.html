<h1>云南锗业第三大股东章建平三季度增仓1961.57万股</h1>
<p>财联社10月20日电，云南锗业(002428.SZ)发布2026年三季报显示，与2026年半年报相比，第三大股东章建平持仓增加1961.57万股至2627.55万股，占总股本比例4.02%。小财注：前十大股东不排除重名情况。</p>
