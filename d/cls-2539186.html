<h1>阿里巴巴第二财季资本开支同比增长60% 自由现金流净流出扩大至345亿元</h1>
<p>财联社11月19日电，阿里巴巴11月19日公布截至2026年9月30日的季度及上半财年业绩显示，第二财季资本开支为504.77亿元人民币，同比增长60%，主要用于扩大AI基础设施投入，以满足客户需求增长。同期自由现金流净流出344.72亿元，上年同期净流出218.4亿元。公司称，云基础设施支出增加是自由现金流净流出扩大的主要原因。</p>
