<h1>天山股份：因涉嫌信息披露违法违规 证监会决定对公司立案</h1>
<p>财联社11月4日电，天山股份(000877.SZ)公告称，公司收到证监会下发的《立案告知书》，因涉嫌信息披露违法违规，证监会决定对公司立案。立案调查期间，公司将积极配合调查工作，并严格履行信息披露义务。目前公司各项经营活动正常开展，董事和高级管理人员正常履职，上述事项不会对公司生产经营产生重大影响。</p>
