<h1>11月9日午间涨停分析</h1>
<p>财联社11月9日电，今日午盘全市场共51股涨停，连板股总数10只，33股封板未遂，封板率为61%（不含ST股、退市股）。焦点股方面，光伏概念股闽发铝业11天7板，短剧概念股文投控股14天7板，机器人概念股新亚制程4连板。</p>
