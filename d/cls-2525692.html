<h1>韩国KOSPI指数低开1.82% SK海力士跌逾6%</h1>
<p>财联社11月5日电，韩国KOSPI指数开盘下跌1.82%，报5580.09点。SK海力士跌逾6%，三星电子跌近3%。</p>
