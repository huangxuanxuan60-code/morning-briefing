<h1>SK海力士预计明年营收及营业利润再上新台阶 明年投资规模将大幅增加</h1>
<p>财联社10月28日电，SK海力士表示，随着龙仁一期晶圆厂明年投产，以及国内外基础设施投资推进，公司明年投资规模预计将较今年大幅增加。公司计划根据客户需求、产品竞争力、盈利能力及投资效率，灵活调整投资规模和时机，并预计明年营收及营业利润将提升至新的规模水平。</p>
