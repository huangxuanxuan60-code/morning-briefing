<h1>市场对10月会议按兵不动的预期升温 加息概率从27%左右降至15%以下</h1>
<p>财联社10月16日电，市场已削减对美联储在10月27日-28日政策会议上加息的预期。在美联储主席沃什“鸽派”发言后，相关加息概率从27%左右降至15%以下。</p>
