<h1>金科股份：股票收盘价低于1元 存在可能因股价低于面值被终止上市的风险</h1>
<p>财联社11月16日电，金科股份(000656.SZ)公告称，公司股票于2026年11月16日收盘价为0.97元/股，低于1元。根据相关规定，公司股票存在可能因股价低于面值被终止上市的风险。本公告为公司首次终止上市风险提示公告。公司表示正积极采取有效措施改善经营基本面，并提醒投资者理性投资，注意风险。</p>
