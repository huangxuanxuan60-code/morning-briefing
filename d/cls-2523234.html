<h1>央行：11月15日起上调金融机构外汇存款准备金率2个百分点</h1>
<p>财联社11月3日电，为加强金融机构外汇流动性管理，中国人民银行决定，自2026年11月15日起，上调金融机构外汇存款准备金率2个百分点，即外汇存款准备金率由现行的4%提高到6%。</p>
