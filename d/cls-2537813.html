<h1>印尼央行关键利率上调25基点至6%</h1>
<p>财联社11月18日电，印尼央行关键利率上调25基点至6%，市场预估为5.75%。印尼央行会后宣布贷款工具利率为6.75%，原为6.50%。</p>
