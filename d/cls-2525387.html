<h1>统一股份：控股子公司与宁德时代签订冷却液战略合作协议</h1>
<p>财联社11月4日电，统一股份(600506.SH)公告称，公司控股子公司统一石化与宁德时代签订《冷却液战略合作协议》，双方将围绕冷却液全生命周期合作模式、可靠性要求、新能源汽车后市场业务及质量共建等方面展开合作。协议有效期至2029年12月31日，尚不涉及具体采购数量及交易金额，预计对本年度经营业绩不构成重大影响。</p>
