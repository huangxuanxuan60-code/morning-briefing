<h1>美国联邦航空管理局因通信问题发布地面停飞令</h1>
<p>财联社11月14日电，美国联邦航空管理局（FAA）以特殊情况为由发布地面停飞令，所有机场地面停飞，直至另行通知。FAA表示，地面停飞源于空中交通管制频率问题。美国交通部长肖恩·达菲表示，美国联邦航空管理局因通信问题发布地面停飞令，问题影响所有航路交通管制中心，技术人员正在调查问题。</p>
