<h1>特锐德：签订2.5亿元算力中心电力方舱采购合同</h1>
<p>财联社11月11日电，特锐德(300001.SZ)公告称，公司与互联网企业A签署算力中心电力方舱集中采购合同，合同总金额预估2.5亿元。合同标的涵盖中压方舱、锂电方舱等多品类电力方舱系统，公司承担整体集成与成套交付。公司表示，2026年1-9月在算力中心领域累计中标金额超15亿元，同比增长超300%。</p>
