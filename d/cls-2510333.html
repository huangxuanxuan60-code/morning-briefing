<h1>参与伊朗-美国谈判的外交官就谈判发表评论：有关“伊朗与美国即将达成协议”的报道有误</h1>
<p>财联社10月20日电，参与伊朗-美国谈判的外交官就谈判发表评论，有关“伊朗与美国即将达成协议”的报道有误。受此消息影响，国际油价短线拉升收窄跌幅，WTI原油期货价格跌1.46%，报97.099美元/桶；布伦特原油期货价格跌1.58%，报107.822美元/桶。</p>
