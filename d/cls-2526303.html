<h1>高通美股盘前跌近10%</h1>
<p>财联社11月5日电，高通美股盘前跌近10%，公司第四季度营收为103.22亿美元，同比下降8.4%。2026财年全年，该公司营收达431.20亿美元，同比下降2.6%；净利润为136.28亿美元，同比增长146%。</p>
