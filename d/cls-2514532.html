<h1>纳指期货高开0.6% 美油低开1%</h1>
<p>财联社10月26日电，周一亚太盘初，美股期指走强，道琼斯指数期货涨0.34%，标普500指数期货涨0.48%，纳斯达克100指数期货涨0.66%。国际油价走弱，WTI原油期货价格跌0.99%，报102.246美元/桶。</p>
