<h1>科翔股份三季报显示章建平退出十大股东名单 半年报曾位列第七大股东</h1>
<p>财联社10月16日电，根据科翔股份(300903.SZ)2026年三季报，截至2026年9月30日，十大股东名单未见章建平的身影；而根据科翔股份2026年半年报，截至2026年6月30日，章建平持有公司946.18万股股份，为公司第七大股东。小财注：前十大股东不排除重名情况。</p>
