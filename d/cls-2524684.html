<h1>11月4日午间涨停分析</h1>
<p>财联社11月4日电，今日午盘全市场共30股涨停，连板股总数10只，22股封板未遂，封板率为60%（不含ST股、退市股）。焦点股方面，白酒股皇台酒业8天5板，医药板块桂林三金5天4板，商业航天概念股上海沪工6天4板。</p>
