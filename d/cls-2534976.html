<h1>国家统计局：1—10月份全国固定资产投资（不含农户）364824亿元 同比下降8.1%</h1>
<p>财联社11月16日电，国家统计局数据显示，1—10月份，全国固定资产投资（不含农户）364824亿元，同比下降8.1%。其中，知识产权产品投资同比增长9.2%。分产业看，第一产业投资7018亿元，同比下降6.1%；第二产业投资142333亿元，下降3.6%；第三产业投资215473亿元，下降10.9%。</p>
