<h1>凤凰航运：涉嫌信息披露违法违规 被证监会立案</h1>
<p>财联社11月6日电，凤凰航运(000520.SZ)公告称，公司于2026年11月6日收到证监会下发的《立案告知书》，因涉嫌信息披露违法违规，证监会决定对公司立案。</p>
