<h1>外交部驳斥《纽约时报》涉华报道：捕风捉影 纯属对中国的污蔑抹黑</h1>
<p>财联社10月30日电，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，《纽约时报》昨天发表独家新闻，称一位中国女性高管与英伟达CEO黄仁勋关系密切，而美国情报机构表示，该女士是中方的情报人员。中方是否了解这个情况，以及有什么评论？郭嘉昆表示，有关报道捕风捉影，纯属对中国的污蔑抹黑。 （北京日报）</p>
