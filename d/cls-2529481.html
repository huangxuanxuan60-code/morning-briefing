<h1>美股高开高走 三大股指均涨超1%</h1>
<p>财联社11月9日电，美股高开高走，道琼斯指数涨1.19%，标普500指数涨1.25%，纳斯达克综合指数涨1.53%。苹果股价上涨2.16%，微软股价上涨2.27%，谷歌-A股价上涨3.54%，亚马逊股价上涨5.74%，台积电股价上涨2.45%，SpaceX股价上涨4.05%，Meta股价上涨5.14%，博通股价上涨6.05%，特斯拉股价上涨3.83%。</p>
