<h1>今年前三季度全国铁路发送旅客37.1亿人次 创历史同期新高</h1>
<p>财联社10月18日电，从国铁集团获悉，今年前三季度，全国铁路累计发送旅客37.1亿人次，同比增长4.8%，创历史同期新高。</p>
