<h1>DeepSeek将整合多团队成立产品部 崔添翼出任负责人</h1>
<p>《科创板日报》16日讯，《科创板日报》记者获悉，DeepSeek将Harness团队以及Web、App、Platform团队整合成“产品部”，负责公司的所有的产品、设计和研发工作，原Harness团队负责人崔添翼任产品部负责人。目前，产品部对外招聘产品设计师和设计师岗位。 （科创板日报记者 黄心怡）</p>
