<h1>SpaceX大涨12%总市值升至2.23万亿美元 超越台积电</h1>
<p>财联社10月21日电，SpaceX股价上涨12.08%，报165.641美元/股，总市值报2.25万亿美元。台积电股价上涨0.34%，报426.535美元/股，总市值报2.21万亿美元。</p>
