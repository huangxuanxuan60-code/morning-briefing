<h1>英伟达升级Isaac机器人平台 推出人形机器人参考框架与仿真工具</h1>
<p>财联社10月21日电，英伟达宣布升级Isaac通用机器人开发平台，推出新的人形机器人参考框架、仿真工作流及数据工具，旨在加速通用机器人开发。相关更新覆盖机器人训练、仿真验证和部署流程，帮助开发者利用合成数据和仿真环境训练机器人，并在实际部署前验证机器人行为。</p>
