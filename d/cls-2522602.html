<h1>央行：将于11月3日开展证券、基金、保险公司互换便利操作 申请额度超1000亿元</h1>
<p>财联社11月2日电，为支持资本市场健康稳定发展，中国人民银行将于11月3日开展证券、基金、保险公司互换便利操作，互换期限1年，可视情展期。目前有31家证券、基金公司申报需求，申请额度超过1000亿元。</p>
