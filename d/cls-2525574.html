<h1>WTI原油期货跌破90美元</h1>
<p>财联社11月5日电，国际油价持续走低，WTI原油期货价格跌6.72%，报89.631美元/桶；布伦特原油期货价格跌7.65%，报95.670美元/桶。</p>
