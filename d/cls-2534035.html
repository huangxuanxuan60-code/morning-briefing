<h1>上交所：本周对全球芯片LOF等溢价较高的基金进行重点监控</h1>
<p>财联社11月13日电，上交所公告，2026年11月9日至2026年11月13日，上交所对95起拉抬打压、虚假申报等证券异常交易行为采取了自律监管措施，对全球芯片LOF等溢价较高的基金进行重点监控，对49起上市公司重大事项等进行专项核查，向证监会上报涉嫌违法违规案件线索1起。</p>
