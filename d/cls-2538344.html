<h1>现货白银跌破45美元</h1>
<p>财联社11月18日电，国际贵金属跌幅扩大，截至目前，现货黄金价格跌2.56%，报3750.69美元/盎司；现货白银价格跌5.07%，报44.98美元/盎司。</p>
