<h1>10月15日涨停分析</h1>
<p>财联社10月15日电，今日全市场共36股涨停，连板股总数6只，7股封板未遂，封板率为84%（不含ST股、退市股）。焦点股方面，PCB概念股澳弘电子19天11板，传媒板块新华文轩14天10板、慈文传媒5连板，鱼粉概念股百洋股份5连板。</p>
