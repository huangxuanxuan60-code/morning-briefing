<h1>AMD率先收复11月5日暴跌失地 在半导体板块反弹中领跑</h1>
<p>财联社11月9日电，AMD连续两个交易日大幅反弹，当日上涨8.8%，上一交易日上涨11%，累计涨幅接近20%，成为半导体板块中首只完全收复11月5日暴跌17%失地的股票。与此同时，SpaceX也已收复此前跌幅。两者成为本轮市场大幅调整后，率先完成失地收复的代表。</p>
