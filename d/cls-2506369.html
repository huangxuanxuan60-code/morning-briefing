<h1>韩国财政部：将密切监测股市波动是否蔓延至债券、外汇和货币市场</h1>
<p>财联社10月16日电，韩国财政部发表声明称，将密切监测股市波动是否蔓延至债券、外汇和货币市场。政府及有关机构将加强股市监测，并严厉应对任何扰乱市场秩序的行为。声明称，强劲的经济增长预期、经常账户顺差以及企业盈利向好，意味着韩国股市基本面依然稳固。</p>
