<h1>台交所加权股价指数本周累跌超17% 创1991年以来最差单周表现</h1>
<p>财联社11月20日电，周五以科技股为主的台股遭遇新一轮抛售，人工智能交易再度承压。台交所加权股价指数收跌6.23%报36033.29点，本周累计下跌17.5%，创1991年以来最差单周表现。全球科技股周五下跌，Anthropic的重磅IPO未能缓解市场对AI交易的普遍疑虑。投资者担心，建设相关技术基础设施投入和举借的巨额资金能否获得相应回报。</p>
