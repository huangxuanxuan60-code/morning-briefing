<h1>三星电子第三季度净利润低于预期</h1>
<p>财联社10月29日电，三星电子第三季度销售额195.25万亿韩元，环比增14%、同比增127%；营业利润107.44万亿韩元，环比增20%、同比大增783%；净利润75.21万亿韩元，预估89.06万亿韩元。</p>
