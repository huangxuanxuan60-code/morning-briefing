<h1>纳指低开1.3% 存储、光通信板块下挫</h1>
<p>财联社10月15日电，美股三大指数开盘涨跌不一，纳指跌1.29%，道指涨0.45%，标普500指数跌0.48%。存储、光通信板块下挫，海力士跌超6%，闪迪跌超5%，西部数据跌超5%，美光科技跌超4%，康宁跌超4%，迈威尔科技跌超5%。</p>
