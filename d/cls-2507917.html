<h1>国家统计局：9月份规模以上工业增加值同比实际增长5.5%</h1>
<p>财联社10月19日电，国家统计局数据显示，9月份，规模以上工业增加值同比实际增长5.5%，增速比上月加快0.3个百分点。从环比看，9月份，规模以上工业增加值比上月增长0.61%。1—9月份，规模以上工业增加值同比增长5.3%。</p>
