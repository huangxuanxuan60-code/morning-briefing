<h1>微软据悉逐步终止从甲骨文租用AI云算力的安排</h1>
<p>财联社11月7日电，微软正在逐步终止从甲骨文租用AI算力的安排。知情人士称，微软在决定不续签合同后，几个月来微软开始逐步停用从甲骨文租用的算力。知情人士表示，随着时间推移，微软租用的这些算力已不再那么有用，因为不再符合公司的规格要求。知情人士称，甲骨文的硬件使用的是较老一代英伟达芯片。</p>
