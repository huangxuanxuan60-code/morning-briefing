<h1>证监会：核准设立花旗证券（中国）有限公司</h1>
<p>财联社10月23日电，证监会核准设立花旗证券（中国）有限公司。花旗中国注册地为上海市，注册资本为人民币12亿元，业务范围为证券经纪、证券投资咨询、证券承销与保荐、证券自营。股东名称及出资额、出资比例为花旗环球金融控股有限公司出资100%。</p>
