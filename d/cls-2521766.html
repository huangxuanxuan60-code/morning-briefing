<h1>央行、证监会将于明天召开座谈会 研究推动支持资本市场工具使用</h1>
<p>财联社11月1日电，一些证券公司和基金公司接到通知，明天上午央行、证监会召开会议，研究推动支持资本市场工具使用。 （21世纪经济报道）</p>
